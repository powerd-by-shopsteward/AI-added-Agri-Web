name: Keep Supabase Alive

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *' 
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/customers?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            --fail-with-body \
            -sS \
            -w "\nHTTP Status: %{http_code}\n"
