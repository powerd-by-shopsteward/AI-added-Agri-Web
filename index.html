<script>
// ==========================================
// SCRIPT A: PRODUCT FORM OVERRIDE (High Precision Fix)
// ==========================================
(function() {
  const originalOpenProductForm = window.openProductForm;
  window.openProductForm = function(existing) {
    const p = existing || {name:'',dual:false,unit:'kg',base_unit:'kg',pack_unit:'bag',pack_size:50,price:0,cost:0,price_base:0,price_pack:0,stock:0,low_stock_alert:5,category:'',primary_unit:'base_unit'};
    const CATEGORIES = ['Insecticide', 'Fungicide', 'Herbicide', 'Spreader', 'PGR', 'Bio stimulant', 'Fertilizer', 'Micro Nutrient'];
    const catOptions = CATEGORIES.map(c => `<option value="${c}" ${p.category === c ? 'selected' : ''}>${c}</option>`).join('');

    openModal(`
      <h2 style="font-size:16px;font-weight:600;margin-bottom:12px">${existing?'Edit Product':'New Product'}</h2>
      <form id="prf" style="display:flex;flex-direction:column;gap:12px">
        <div><label class="label">Name *</label><input class="input" name="name" required value="${esc(p.name)}"></div>
        <div class="grid-2">
          <div><label class="label">Category</label><select class="input" name="category"><option value="">-- Select Category --</option>${catOptions}</select></div>
          <div><label class="label">Dual Unit</label><select class="input" name="dual"><option value="no" ${!p.dual?'selected':''}>No - single unit</option><option value="yes" ${p.dual?'selected':''}>Yes - loose + pack</option></select></div>
        </div>
        <div id="single-block" style="display:${p.dual?'none':'block'}">
          <div class="grid-2">
            <div><label class="label">Unit</label><select class="input" name="unit">${BASE_UNITS.concat(PACK_UNITS).filter((v,i,a)=>a.indexOf(v)===i).map(u=>`<option ${p.unit===u?'selected':''}>${u}</option>`).join('')}</select></div>
            <div><label class="label">Sell price / unit (₹)</label><input class="input" type="number" step="any" name="price" value="${p.price||0}"></div>
            <div><label class="label">Cost price / unit (₹)</label><input class="input" type="number" step="any" name="single_cost" value="${p.cost||0}"></div>
            <div><label class="label">Stock</label><input class="input" type="number" step="any" name="stock1" value="${p.stock||0}"></div>
            <div><label class="label">Low alert at</label><input class="input" type="number" name="low1" value="${p.low_stock_alert||5}"></div>
          </div>
        </div>
        <div id="dual-block" style="display:${p.dual?'block':'none'}">
          <div class="grid-2">
            <div><label class="label">Base unit</label><select class="input" name="base_unit">${BASE_UNITS.map(u=>`<option ${p.base_unit===u?'selected':''}>${u}</option>`).join('')}</select></div>
            <div><label class="label">Pack unit</label><select class="input" name="pack_unit">${PACK_UNITS.map(u=>`<option ${p.pack_unit===u?'selected':''}>${u}</option>`).join('')}</select></div>
          </div>
          <div style="margin-top:10px"><label class="label">1 <span class="pk-lbl">${p.pack_unit}</span> = <input class="input" type="number" step="any" name="pack_size" id="pack_size_input" value="${p.pack_size||50}" style="display:inline-block;width:100px;margin:0 6px"> <span class="bs-lbl">${p.base_unit}</span></label></div>
          <div class="grid-2" style="margin-top:10px">
            <div><label class="label">Sell / base unit (₹)</label><input class="input" type="number" step="any" name="price_base" value="${p.price_base||0}"></div>
            <div><label class="label">Sell / pack (₹)</label><input class="input" type="number" step="any" name="price_pack" value="${p.price_pack||0}"></div>
            <div><label class="label">Cost / base unit (₹)</label><input class="input" type="number" step="any" name="dual_cost_base" id="cost_base_input" value="${p.cost||0}"></div>
            <div><label class="label" style="color:#e65100;">Cost / pack (₹) - Auto calculates base cost</label><input class="input" type="number" step="any" name="cost_pack" id="cost_pack_input" value="${(p.cost > 0 && p.pack_size > 0) ? (p.cost * p.pack_size).toFixed(2) : 0}" style="border-color:#ffcc80;"></div>
            <div><label class="label">Stock (base unit)</label><input class="input" type="number" step="any" name="stock2" value="${p.stock||0}"></div>
            <div><label class="label">Low alert (base unit)</label><input class="input" type="number" name="low2" value="${p.low_stock_alert||5}"></div>
          </div>
          <div style="margin-top:10px"><label class="label">Primary display</label><select class="input" name="primary_unit"><option value="base_unit" ${p.primary_unit==='base_unit'?'selected':''}>Base unit first</option><option value="pack_unit" ${p.primary_unit==='pack_unit'?'selected':''}>Pack unit first</option></select></div>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="prf-save">${existing?'Update':'Save'}</button></div>
      </form>`, root => {
      setTimeout(() => {
        try {
          const costBase = root.querySelector('#cost_base_input'); const costPack = root.querySelector('#cost_pack_input'); const packSize = root.querySelector('#pack_size_input');
          const dualSel = root.querySelector('[name="dual"]'); const singleB = root.querySelector('#single-block'); const dualB = root.querySelector('#dual-block');
          const bu = root.querySelector('[name="base_unit"]'); const pu = root.querySelector('[name="pack_unit"]');
          if (costPack && costBase && packSize) {
            const syncCosts = () => { const baseVal = Number(costBase.value) || 0; const sizeVal = Number(packSize.value) || 1; if(document.activeElement === costPack) { costBase.value = (Number(costPack.value) / sizeVal).toFixed(4); } else if (document.activeElement === costBase) { costPack.value = (baseVal * sizeVal).toFixed(2); } };
            costPack.addEventListener('input', syncCosts); costBase.addEventListener('input', syncCosts); packSize.addEventListener('input', syncCosts);
          }
          if (dualSel && singleB && dualB) { dualSel.onchange = () => { const isDual = dualSel.value === 'yes'; singleB.style.display = isDual?'none':'block'; dualB.style.display = isDual?'block':'none'; }; }
          if (bu && pu) { const upLbls = () => { root.querySelectorAll('.pk-lbl').forEach(e=>e.textContent=pu.value); root.querySelectorAll('.bs-lbl').forEach(e=>e.textContent=bu.value); }; bu.onchange = upLbls; pu.onchange = upLbls; upLbls(); }
        } catch(err) { console.log("Form setup skipped:", err.message); }
      }, 100);
      
      root.querySelector('#prf').onsubmit = async e => {
        e.preventDefault();
        const fd = new FormData(e.target); const isDual = fd.get('dual') === 'yes'; const name = (fd.get('name')||'').trim();
        if(!name){ toast('Enter product name','error'); return; }
        let data;
        if(isDual){
          const packSizeEl = root.querySelector('#pack_size_input'); const costPackEl = root.querySelector('#cost_pack_input'); const costBaseEl = root.querySelector('#cost_base_input');
          const ps = packSizeEl ? (Number(packSizeEl.value) || 1) : 1; const costPackVal = costPackEl ? (Number(costPackEl.value) || 0) : 0; const costBaseVal = costBaseEl ? (Number(costBaseEl.value) || 0) : 0;
          const finalCostBase = costPackVal > 0 ? (costPackVal / ps) : costBaseVal;
          const roundedCostBase = Math.round(finalCostBase * 10000) / 10000;
          data = { name, category: fd.get('category')||'', dual: true, base_unit: fd.get('base_unit'), pack_unit: fd.get('pack_unit'), pack_size: ps, price_base: Number(fd.get('price_base'))||0, price_pack: Number(fd.get('price_pack'))||0, cost: roundedCostBase, stock: Number(fd.get('stock2'))||0, low_stock_alert: Number(fd.get('low2'))||0, primary_unit: fd.get('primary_unit')||'base_unit', unit: null, price: null };
        } else {
          data = { name, category: fd.get('category')||'', dual: false, unit: fd.get('unit'), price: Number(fd.get('price'))||0, cost: Number(fd.get('single_cost'))||0, stock: Number(fd.get('stock1'))||0, low_stock_alert: Number(fd.get('low1'))||0, base_unit: null, pack_unit: null, pack_size: null, price_base: 0, price_pack: 0, primary_unit: 'base_unit' };
        }
        if (!existing) { const duplicate = DB.products.find(x => x.name.toLowerCase() === name.toLowerCase() && (x.unit === fd.get('unit') || x.base_unit === fd.get('base_unit')) && (x.price == fd.get('price') || x.price_pack == fd.get('price_pack'))); if (duplicate) { existing = duplicate; toast('Product already exists. Updating existing card instead.', 'info'); } }
        const btn = root.querySelector('#prf-save'); btn.disabled = true; btn.textContent = 'Saving...';
        let result;
        if(existing) result = await sb.from('products').update(data).eq('id', existing.id).select().single();
        else result = await sb.from('products').insert(data).select().single();
        if(result.error){ toast(result.error.message,'error'); btn.disabled = false; btn.textContent = existing?'Update':'Save'; return; }
        await syncDB(); toast(existing?'Updated':'Added','success'); closeModal(); route();
      };
    });
  };
})();
</script>
<script>
// ==========================================
// SCRIPT B & C: PRODUCT GRID, MONEY CARDS, RESTOCK
// ==========================================
(function() {
  const originalRenderProducts = window.renderProducts;
  window.renderProducts = function(content) {
    originalRenderProducts.call(this, content);

    const allCards = content.querySelectorAll('.card');
    let costCardFound = false, retailCardFound = false;
    allCards.forEach(card => {
      const text = card.innerText || '';
      if (text.includes('TOTAL STOCK COST')) { if (costCardFound) card.remove(); else costCardFound = true; }
      if (text.includes('TOTAL RETAIL VALUE')) { if (retailCardFound) card.remove(); else retailCardFound = true; }
    });
    const catFilter = content.querySelector('#prod-cat');
    if (catFilter) { const seen = new Set(); catFilter.querySelectorAll('option').forEach(opt => { const val = opt.value.toLowerCase(); if (val === 'all' || val === '') return; if (seen.has(val)) opt.remove(); else seen.add(val); }); }

    let totalCostValue = 0, totalRetailValue = 0;
    DB.products.forEach(p => { const stock = Number(p.stock) || 0; const cost = Number(p.cost) || 0; let retail = p.dual ? (Number(p.price_base) || 0) : (Number(p.price) || 0); totalCostValue += (stock * cost); totalRetailValue += (stock * retail); });
    const summaryHTML = `
      <div class="grid-2 custom-summary-cards" style="margin-bottom: 16px;">
        <div class="card" style="background: #fff3e0; border-color: #ffcc80;"><div style="font-size:11px; color:var(--s600); font-weight:600; text-transform:uppercase;">Total Stock Cost (Money Invested)</div><div style="font-size:22px; font-weight:700; color:#e65100; margin-top:4px;">${rs(totalCostValue)}</div></div>
        <div class="card" style="background: #e8f5e9; border-color: #a5d6a7;"><div style="font-size:11px; color:var(--s600); font-weight:600; text-transform:uppercase;">Total Retail Value (Potential Sales)</div><div style="font-size:22px; font-weight:700; color:#2e7d32; margin-top:4px;">${rs(totalRetailValue)}</div></div>
      </div>`;
    const pageHead = content.querySelector('.page-head');
    if (pageHead) { const oldCustom = content.querySelector('.custom-summary-cards'); if(oldCustom) oldCustom.remove(); pageHead.insertAdjacentHTML('afterend', summaryHTML); }

    function addCardFeatures() {
      const grid = content.querySelector('#prod-grid');
      if (!grid) return;
      grid.querySelectorAll('.card').forEach(card => {
        const editBtn = card.querySelector('[data-edit]');
        if (!editBtn) return;
        const pId = editBtn.getAttribute('data-edit');
        const p = DB.products.find(x => x.id === pId);
        if (!p) return;
        if (!card.querySelector('[data-restock]')) { const btnContainer = editBtn.parentElement; if (btnContainer) { const restockBtn = document.createElement('button'); restockBtn.className = 'btn btn-ghost btn-sm'; restockBtn.style.color = 'var(--b700)'; restockBtn.style.fontWeight = '600'; restockBtn.setAttribute('data-restock', pId); restockBtn.innerHTML = '+ Stock'; btnContainer.insertBefore(restockBtn, editBtn); } }
        if (!card.querySelector('.stock-value-box')) { const stock = Number(p.stock) || 0; const cost = Number(p.cost) || 0; let retail = p.dual ? (Number(p.price_base) || 0) : (Number(p.price) || 0); const costValue = stock * cost; const retailValue = stock * retail; const valueHTML = `<div class="stock-value-box" style="margin-top:10px; padding-top:8px; border-top:1px dashed var(--s200); font-size:11px; display:flex; justify-content:space-between; color:var(--s600);"><span>Cost: <b style="color:#e65100;">${rs(costValue)}</b></span><span>Retail: <b style="color:#2e7d32;">${rs(retailValue)}</b></span></div>`; card.insertAdjacentHTML('beforeend', valueHTML); }
      });
    }
    addCardFeatures(); setTimeout(addCardFeatures, 200);
    ['prod-search', 'prod-cat', 'prod-sort', 'prod-filter'].forEach(id => { const el = content.querySelector('#' + id); if (el) { el.addEventListener('input', () => setTimeout(addCardFeatures, 50)); el.addEventListener('change', () => setTimeout(addCardFeatures, 50)); } });
  };

  document.addEventListener('click', function(e) {
    const btn = e.target.closest('[data-restock]');
    if (btn) {
      e.preventDefault(); const pId = btn.getAttribute('data-restock'); const p = DB.products.find(x => x.id === pId); if (!p) return;
      const isDual = p.dual; const baseUnit = isDual ? p.base_unit : p.unit; const packUnit = isDual ? p.pack_unit : ''; const packSize = isDual ? Number(p.pack_size) : 1;
      const currentStockDisplay = isDual ? `${fmtNum(p.stock)} ${baseUnit} (${fmtNum(Number(p.stock)/packSize)} ${packUnit})` : `${fmtNum(p.stock)} ${p.unit}`;
      openModal(`<h2 style="font-size:16px;font-weight:600;margin-bottom:12px">Restock: ${esc(p.name)}</h2><div style="background:var(--s50);padding:10px;border-radius:8px;margin-bottom:12px;font-size:13px">Current Stock: <b>${currentStockDisplay}</b></div><form id="restock-form" style="display:flex;flex-direction:column;gap:12px">${isDual ? `<div><label class="label">Adding by</label><select class="input" name="add_type"><option value="pack">${packUnit} (1 ${packUnit} = ${packSize} ${baseUnit})</option><option value="base">${baseUnit}</option></select></div>` : ''}<div><label class="label">Quantity to Add *</label><input class="input" type="number" step="0.01" name="qty" required autofocus placeholder="e.g. 5"></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="restock-save">Add Stock</button></div></form>`, root => {
        root.querySelector('#restock-form').onsubmit = async e => { e.preventDefault(); const fd = new FormData(e.target); const qty = Number(fd.get('qty')) || 0; if (qty <= 0) { toast('Quantity must be > 0', 'error'); return; } const addType = isDual ? fd.get('add_type') : 'base'; let addedBaseQty = qty; if (isDual && addType === 'pack') addedBaseQty = qty * packSize; const newStock = (Number(p.stock) || 0) + addedBaseQty; const btn = root.querySelector('#restock-save'); btn.disabled = true; btn.textContent = 'Updating...'; const { error } = await sb.from('products').update({ stock: newStock }).eq('id', p.id); if (error) { toast(error.message, 'error'); btn.disabled = false; btn.textContent = 'Add Stock'; return; } await syncDB(); toast('Stock added successfully!', 'success'); closeModal(); route(); };
      });
    }
  });
})();
</script>

<script>
// ==========================================
// PART 4: PRINTER LOGIC (58mm Receipts, USB & Bluetooth)
// ==========================================
(function() {
  const style = document.createElement('style');
  style.innerHTML = `
    @media print {
      @page { size: 58mm auto; margin: 0; }
      body { width: 58mm; margin: 0; padding: 0; background: #fff !important; }
      body * { visibility: hidden !important; }
      #print-area, #print-area * { visibility: visible !important; }
      #print-area {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 48mm !important;
        margin: 0 auto !important;
        font-family: 'Courier New', monospace !important;
        font-size: 12px !important;
        box-shadow: none !important;
        border: 0 !important;
        padding: 0 !important;
      }
      #toast-root, #modal-root, #calc-root { display: none !important; }
    }
  `;
  document.head.appendChild(style);

  function padLine(left, right, width = 32) {
    left = String(left); right = String(right);
    if (left.length + right.length > width) left = left.substring(0, width - right.length - 1);
    const spaces = ' '.repeat(Math.max(1, width - left.length - right.length));
    return left + spaces + right;
  }

  window.invoicePDF = async function(inv, items, cust) {
    const {jsPDF} = window.jspdf; 
    const doc = new jsPDF({unit:'mm',format:[58, 200]}); 
    const w = 58; let y = 6;
    if(SETTINGS.logo){ const sz = 18; try{ doc.addImage(SETTINGS.logo,'PNG',(w-sz)/2,y,sz,sz); y+=sz+2; }catch(e){} }
    doc.setFontSize(11); doc.setFont('helvetica','bold'); doc.text(SETTINGS.shop_name,w/2,y,{align:'center'}); y+=5;
    doc.setFontSize(7); doc.setFont('helvetica','normal'); doc.text(SETTINGS.owner_name,w/2,y,{align:'center'}); y+=3;
    doc.text(SETTINGS.address,w/2,y,{align:'center',maxWidth:w-6}); y+=6;
    doc.text('License: '+SETTINGS.license,w/2,y,{align:'center'}); y+=5;
    doc.line(4,y,w-4,y); y+=4;
    doc.setFontSize(8); doc.text('Invoice: '+inv.invoice_no,4,y); y+=4;
    doc.text('Date: '+txDT(inv,'invoice_date'),4,y); y+=4;
    doc.text('Customer: '+(cust?.name||'Walk-in'),4,y); y+=6;
    doc.autoTable({ startY:y, head:[['Item','Qty','Rate','Amt']], body: items.map(i=>[productLineLabel(i),`${i.qty}`,Number(i.price).toFixed(0),Number(i.total).toFixed(0)]), theme:'grid', styles:{fontSize:8,cellPadding:1.5}, headStyles:{fillColor:[22,163,74],textColor:255,fontSize:8}, margin:{left:2,right:2} });
    y = doc.lastAutoTable.finalY + 4;
    doc.setFontSize(8); doc.text('Subtotal: '+rs(inv.subtotal),w-4,y,{align:'right'}); y+=4;
    if(Number(inv.discount)>0){ doc.text('Discount: -'+rs(inv.discount),w-4,y,{align:'right'}); y+=4; }
    doc.setFont('helvetica','bold'); doc.text('Total: '+rs(inv.total),w-4,y,{align:'right'}); y+=4;
    doc.setFont('helvetica','normal'); doc.text('Paid: '+rs(inv.paid),w-4,y,{align:'right'}); y+=4;
    doc.text('Due: '+rs(inv.due),w-4,y,{align:'right'}); y+=6;
    if(Number(inv.due)>0){ doc.line(4,y,w-4,y); y+=4; doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.text('Pay via UPI',w/2,y,{align:'center'}); y+=4; doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.text('UPI: '+SETTINGS.upi,w/2,y,{align:'center'}); y+=3; doc.text('Amount: '+rs(inv.due),w/2,y,{align:'center'}); y+=4; try{ const qr = await QRCode.toDataURL(upiLink(inv.due,'Invoice '+inv.invoice_no),{margin:0,width:200}); const sz = 34; doc.addImage(qr,'PNG',(w-sz)/2,y,sz,sz); y+=sz+3; doc.setFontSize(6); doc.text('Scan with any UPI app',w/2,y,{align:'center'}); y+=4; }catch(e){} }
    doc.setFontSize(7); doc.text('Thank you!',w/2,y,{align:'center'});
    doc.save(inv.invoice_no+'.pdf');
  };

  async function printThermalReceipt(inv, items, cust) {
    try {
      const device = await navigator.usb.requestDevice({ filters: [{ vendorId: 0x0483 }] });
      const connection = new EscposBuffer.WebUSB(device);
      const printer = await EscposBuffer.Printer.CONNECT('HOP-HL58', connection);
      await printer.setColumns(32); 

      await printer.withStyle({ align: 'center', bold: true }, async () => { await printer.writeln(SETTINGS.shop_name); });
      await printer.withStyle({ align: 'center' }, async () => { await printer.writeln(SETTINGS.owner_name); await printer.writeln(SETTINGS.address.substring(0, 32)); if (SETTINGS.phone) await printer.writeln('Ph: ' + SETTINGS.phone); });
      await printer.writeln('--------------------------------');
      await printer.withStyle({ align: 'left' }, async () => { await printer.writeln(padLine('Invoice:', inv.invoice_no)); await printer.writeln(padLine('Date:', txDT(inv, 'invoice_date'))); await printer.writeln(padLine('Customer:', cust?.name || 'Walk-in')); });
      await printer.writeln('--------------------------------');
      await printer.writeln(padLine('Item', 'Amount')); 
      await printer.writeln('--------------------------------');
      for (const item of items) { const itemName = productLineLabel(item); const qtyPrice = `${item.qty} x ${Number(item.price).toFixed(2)}`; const total = Number(item.total).toFixed(2); await printer.writeln(itemName.substring(0, 32)); await printer.writeln(padLine(`  ${qtyPrice}`, total)); }
      await printer.writeln('--------------------------------');
      await printer.withStyle({ align: 'right' }, async () => { await printer.writeln(padLine('Subtotal:', rs(inv.subtotal))); if (Number(inv.discount) > 0) await printer.writeln(padLine('Discount:', '-' + rs(inv.discount))); await printer.withStyle({ bold: true }, async () => { await printer.writeln(padLine('Total:', rs(inv.total))); }); await printer.writeln(padLine('Paid:', rs(inv.paid))); await printer.writeln(padLine('Due:', rs(inv.due))); });
      await printer.withStyle({ align: 'center' }, async () => { await printer.writeln(''); await printer.writeln('Thank you! Visit again.'); await printer.writeln(SETTINGS.upi); });
      await printer.feed(4); await printer.cutter();
      toast('Receipt printed perfectly!', 'success');
    } catch (error) { console.error('Printing failed:', error); toast('Printing failed: ' + error.message, 'error'); }
  }

  let btPrinter = null;
  function rsPrinter(n) { return 'Rs.' + inr(n); }
  async function printLogoToEncoder(encoder, logoUrl) {
    if (!logoUrl) return;
    try {
      const img = new Image(); img.crossOrigin = 'Anonymous'; img.src = logoUrl;
      await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = () => reject(new Error('Logo failed to load')); });
      const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
      const maxWidth = 96; const scale = Math.min(1, maxWidth / img.width); canvas.width = img.width * scale; canvas.height = img.height * scale;
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height); const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      encoder.align('center'); encoder.image(imageData, canvas.width, canvas.height); encoder.newline();
    } catch (error) { console.log('Logo skipped:', error.message); }
  }

  async function printViaBluetooth(inv, items, cust) {
    if (!navigator.bluetooth) { toast('Bluetooth not supported. Try using Chrome on Android.', 'error'); return; }
    if (typeof ReceiptPrinterEncoder === 'undefined' || typeof WebBluetoothReceiptPrinter === 'undefined') { toast('Printer libraries not loaded. Check your internet connection.', 'error'); return; }
    try {
      if (!btPrinter) { btPrinter = new WebBluetoothReceiptPrinter(); btPrinter.addEventListener('connected', device => { console.log(`Connected to ${device.name}`); }); await btPrinter.connect(); }
      let encoder = new ReceiptPrinterEncoder({ language: 'esc-pos' });
      if (SETTINGS.logo) { await printLogoToEncoder(encoder, SETTINGS.logo); }
      encoder.align('center').bold(true).text(SETTINGS.shop_name || 'YOUR_SHOP_NAME').newline();
      encoder.bold(false).text(SETTINGS.owner_name || '').newline();
      encoder.text(SETTINGS.address || '').newline();
      if (SETTINGS.phone) encoder.text('Ph: ' + SETTINGS.phone).newline();
      encoder.text('--------------------------------').newline();
      encoder.align('left'); encoder.text(padLine('Invoice:', inv.invoice_no)).newline(); encoder.text(padLine('Date:', txDT(inv, 'invoice_date'))).newline(); encoder.text(padLine('Customer:', cust?.name || 'Walk-in')).newline(); encoder.text('--------------------------------').newline();
      encoder.text(padLine('Item', 'Amount')).newline(); encoder.text('--------------------------------').newline();
      for (const item of items) { const itemName = productLineLabel(item); const qtyPrice = `${item.qty} x ${Number(item.price).toFixed(2)}`; const total = Number(item.total).toFixed(2); encoder.text(itemName.substring(0, 32)).newline(); encoder.text(padLine(`  ${qtyPrice}`, total)).newline(); }
      encoder.text('--------------------------------').newline();
      encoder.align('left'); encoder.text(padLine('Subtotal:', rsPrinter(inv.subtotal))).newline(); if (Number(inv.discount) > 0) encoder.text(padLine('Discount:', '-' + rsPrinter(inv.discount))).newline();
      encoder.bold(true).text(padLine('Total:', rsPrinter(inv.total))).newline(); encoder.bold(false).text(padLine('Paid:', rsPrinter(inv.paid))).newline(); encoder.text(padLine('Due:', rsPrinter(inv.due))).newline();
      encoder.align('center').newline(1).text('Thank you! Visit again.').newline(); encoder.text(SETTINGS.upi || '').newline(2); encoder.cut();
      const data = encoder.encode(); await btPrinter.print(data); toast('Receipt printed successfully!', 'success');
    } catch (error) { console.error('Bluetooth printing error:', error); toast('Printing failed: ' + error.message, 'error'); btPrinter = null; }
  }

  document.addEventListener('click', function(e) {
    if (e.target && e.target.id === 'btn-print') {
      if (location.hash.startsWith('#/invoice/')) {
        const id = location.hash.slice(10); const inv = DB.invoices.find(x => x.id === id); const items = DB.invoice_items.filter(i => i.invoice_id === id); const cust = DB.customers.find(c => c.id === inv.customer_id);
        e.preventDefault(); e.stopPropagation();
        if (navigator.bluetooth) { printViaBluetooth(inv, items, cust); } else { window.print(); }
      }
    }
  }, true);
})();
</script>

<script>
// ==========================================
// SCRIPT E: EXPENSES TRACKER (Manual Calculation & Date Filter)
// ==========================================
(function() {
  let ALL_EXPENSES = [];
  let filterFrom = todayStr().slice(0,8) + '01';
  let filterTo = todayStr();

  async function syncExpenses() {
    const { data, error } = await sb.from('expenses').select('*').order('expense_date', { ascending: false });
    if (!error && data) ALL_EXPENSES = data;
  }

  async function renderExpensesPage(content) {
    await syncExpenses();
    const filtered = ALL_EXPENSES.filter(e => e.expense_date >= filterFrom && e.expense_date <= filterTo);
    const total = filtered.reduce((s, e) => s + Number(e.amount), 0);

    content.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="page-head">
          <div><h1 style="font-size:22px;font-weight:700">Expenses</h1><p style="color:var(--s500);font-size:13px">Track and filter your shop costs.</p></div>
          <div class="page-actions"><button id="add-exp" class="btn btn-primary">+ Add Expense</button></div>
        </div>
        <div class="card" style="display:flex;gap:10px;flex-wrap:wrap;align-items:end">
          <div style="flex:1;min-width:140px"><label class="label">From</label><input class="input" type="date" id="exp-from" value="${filterFrom}"></div>
          <div style="flex:1;min-width:140px"><label class="label">To</label><input class="input" type="date" id="exp-to" value="${filterTo}"></div>
          <div style="flex:0 0 auto"><label class="label">&nbsp;</label><button class="btn btn-primary" id="exp-load">Apply Filter</button></div>
        </div>
        <div class="grid-3">
          <div class="card" style="background:#fef2f2;border-color:#fecaca;">
            <div style="font-size:11px;color:var(--s600);font-weight:600;text-transform:uppercase;">Total Expenses (Selected Period)</div>
            <div style="font-size:22px;font-weight:700;color:var(--r600);margin-top:4px;">${rs(total)}</div>
          </div>
        </div>
        <div class="card" style="overflow-x:auto">
          <table>
            <thead><tr><th>Date</th><th>Category</th><th>Notes</th><th style="text-align:right">Amount</th><th></th></tr></thead>
            <tbody id="exp-body"></tbody>
          </table>
        </div>
      </div>`;

    function renderTable() {
      const body = document.getElementById('exp-body');
      if (!body) return;
      body.innerHTML = filtered.length === 0 
        ? '<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--s500)">No expenses in this date range</td></tr>'
        : filtered.map(e => `
          <tr>
            <td>${fmtDate(e.expense_date)} ${e.tx_time ? e.tx_time : ''}</td>
            <td style="font-weight:500">${esc(e.category || '-')}</td>
            <td style="color:var(--s500);font-size:12px">${esc(e.notes || '-')}</td>
            <td style="text-align:right;font-weight:600;color:var(--r600)">${rs(e.amount)}</td>
            <td style="text-align:right;white-space:nowrap">
              <button class="btn btn-ghost btn-sm" data-edit-exp="${e.id}">Edit</button>
              <button class="btn btn-ghost btn-sm" data-del-exp="${e.id}" style="color:var(--r600)">Del</button>
            </td>
          </tr>`).join('');

      document.querySelectorAll('[data-del-exp]').forEach(b => b.onclick = async () => {
        if (!confirmDlg('Delete this expense?', 'Confirm Delete')) return;
        await sb.from('expenses').delete().eq('id', b.dataset.delExp);
        await renderExpensesPage(content);
      });

      document.querySelectorAll('[data-edit-exp]').forEach(b => b.onclick = () => {
        const e = ALL_EXPENSES.find(x => x.id === b.dataset.editExp);
        openExpenseForm(e, () => renderExpensesPage(content));
      });
    }
    renderTable();

    document.getElementById('add-exp').onclick = () => openExpenseForm(null, () => renderExpensesPage(content));
    document.getElementById('exp-load').onclick = () => {
      filterFrom = document.getElementById('exp-from').value;
      filterTo = document.getElementById('exp-to').value;
      renderExpensesPage(content);
    };
  }

  function openExpenseForm(existing, onSave) {
    const e = existing || { amount: '', category: '', notes: '', expense_date: todayStr(), tx_time: '' };
    openModal(`
      <h2 style="font-size:16px;font-weight:600;margin-bottom:12px">${existing ? 'Edit Expense' : 'Add Expense'}</h2>
      <form id="exp-form" style="display:flex;flex-direction:column;gap:12px">
        ${dateTimeFieldHTML(e.expense_date, e.tx_time, 'Expense Date')}

<script>
// ==========================================
// SCRIPT G: CLEAN P&L OVERRIDE (Fixes all leftover errors)
// ==========================================
(function() {
  window.renderPnL = function(content) {
    const today = todayStr();
    const firstOfMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().slice(0,10);
    content.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="page-head"><h1 style="font-size:22px;font-weight:700">Profit &amp; Loss</h1></div>
        <div class="card" style="display:flex;gap:10px;flex-wrap:wrap;align-items:end">
          <div><label class="label">From</label><input class="input" type="date" id="pnl-from" value="${firstOfMonth}" max="${today}"></div>
          <div><label class="label">To</label><input class="input" type="date" id="pnl-to" value="${today}" max="${today}"></div>
          <div><button class="btn btn-primary" id="pnl-load">Load</button></div>
          <div style="flex:1"></div>
          <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-ghost" id="pnl-today">Today</button><button class="btn btn-ghost" id="pnl-month">This month</button><button class="btn btn-ghost" id="pnl-year">This year</button></div>
        </div>
        <div class="grid-4" id="pnl-stats"></div>
        <div class="card"><h2 style="font-weight:600;margin-bottom:12px">Product-wise Profit</h2><div style="overflow-x:auto"><table><thead><tr><th>Product</th><th style="text-align:right">Sold Qty</th><th style="text-align:right">Revenue</th><th style="text-align:right">Cost</th><th style="text-align:right">Profit</th><th style="text-align:right">Margin %</th></tr></thead><tbody id="pnl-body"></tbody></table></div></div>
        <div class="card" style="display:flex;gap:8px;flex-wrap:wrap"><button id="pnl-print" class="btn btn-ghost">Print</button><button id="pnl-pdf" class="btn btn-primary">PDF</button></div>
      </div>`;

    function compute(from, to){
      const invs = DB.invoices.filter(i => { const d = txDate(i,'invoice_date'); return d >= from && d <= to; });
      const perProduct = {};
      let totalRevenue = 0, totalCost = 0;
      invs.forEach(inv => {
        const items = DB.invoice_items.filter(x => x.invoice_id === inv.id);
        items.forEach(it => {
          const p = DB.products.find(x => x.id === it.product_id);
          const costPerBase = p ? Number(p.cost)||0 : 0;
          const baseQty = lineDeductBaseQty(it);
          const cost = baseQty * costPerBase;
          const rev = Number(it.total)||0;
          const key = it.product_id || it.product_name;
          if(!perProduct[key]) perProduct[key] = { name: it.product_name, revenue:0, cost:0, qty:0, unit: (p ? (p.dual ? p.base_unit : p.unit) : '') };
          perProduct[key].revenue += rev;
          perProduct[key].cost += cost;
          perProduct[key].qty += baseQty;
          totalRevenue += rev;
          totalCost += cost;
        });
      });
      const profit = totalRevenue - totalCost;
      const margin = totalRevenue > 0 ? (profit / totalRevenue) * 100 : 0;
      return { perProduct, totalRevenue, totalCost, profit, margin, count: invs.length };
    }

    function render(){
      const from = document.getElementById('pnl-from').value, to = document.getElementById('pnl-to').value;
      if(!from || !to){ toast('Pick both dates','error'); return; }
      if(from > to){ toast('From cannot be after To','error'); return; }
      const r = compute(from, to);
      document.getElementById('pnl-stats').innerHTML = `<div class="card"><div style="font-size:11px;color:var(--s500)">Revenue</div><div style="font-size:18px;font-weight:700">${rs(r.totalRevenue)}</div><div style="font-size:11px;color:var(--s500);margin-top:2px">${r.count} invoices</div></div><div class="card"><div style="font-size:11px;color:var(--s500)">Cost of Goods</div><div style="font-size:18px;font-weight:700;color:var(--s600)">${rs(r.totalCost)}</div></div><div class="card" style="background:${r.profit>=0?'#f0fdf4':'#fef2f2'}"><div style="font-size:11px;color:var(--s500)">Profit</div><div style="font-size:18px;font-weight:700;color:${r.profit>=0?'var(--b700)':'var(--r600)'}">${rs(r.profit)}</div></div><div class="card"><div style="font-size:11px;color:var(--s500)">Margin</div><div style="font-size:18px;font-weight:700">${r.margin.toFixed(1)}%</div></div>`;
      const rows = Object.values(r.perProduct).sort((a,b)=>(b.revenue-b.cost)-(a.revenue-a.cost));
      document.getElementById('pnl-body').innerHTML = rows.length === 0
        ? '<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--s500)">No sales in this range</td></tr>'
        : rows.map(x => { const p = x.revenue - x.cost; const m = x.revenue > 0 ? (p/x.revenue)*100 : 0; return `<tr><td>${esc(x.name)}</td><td style="text-align:right">${fmtNum(x.qty)} ${esc(x.unit)}</td><td style="text-align:right">${rs(x.revenue)}</td><td style="text-align:right;color:var(--s600)">${rs(x.cost)}</td><td style="text-align:right;font-weight:600;color:${p>=0?'var(--b700)':'var(--r600)'}">${rs(p)}</td><td style="text-align:right;color:${m>=0?'var(--b700)':'var(--r600)'}">${m.toFixed(1)}%</td></tr>`; }).join('');
      const kpis = [['From',from],['To',to],['Revenue',rs(r.totalRevenue)],['Cost',rs(r.totalCost)],['Profit',rs(r.profit)],['Margin',r.margin.toFixed(1)+'%']];
      const tables = [{title:'Product-wise Profit',head:['Product','Sold Qty','Revenue','Cost','Profit','Margin %'],rows: rows.map(x => { const p = x.revenue-x.cost; const m = x.revenue>0 ? (p/x.revenue)*100 : 0; return [x.name, fmtNum(x.qty)+' '+x.unit, rs(x.revenue), rs(x.cost), rs(p), m.toFixed(1)+'%']; })}];
      const title = 'Profit & Loss '+from+' to '+to;
      document.getElementById('pnl-print').onclick = () => printReport(title, kpis, tables);
      document.getElementById('pnl-pdf').onclick = () => pdfReport(title, kpis, tables);
    }

    document.getElementById('pnl-today').onclick = () => { document.getElementById('pnl-from').value = today; document.getElementById('pnl-to').value = today; render(); };
    document.getElementById('pnl-month').onclick = () => { document.getElementById('pnl-from').value = firstOfMonth; document.getElementById('pnl-to').value = today; render(); };
    document.getElementById('pnl-year').onclick = () => { document.getElementById('pnl-from').value = new Date().getFullYear()+'-01-01'; document.getElementById('pnl-to').value = today; render(); };
    document.getElementById('pnl-load').onclick = render;
    render();
  };
})();
</script>

// ==========================================
// SCRIPT I: HUMAN-READABLE UNIT FORMATTING
// ==========================================
(function() {
  window.fmtInvQty = function(qty, unit) {
    const q = Number(qty);
    if (!unit) return q;
    const u = String(unit).toLowerCase();
    if (u === 'gram' && q >= 1000) { const kg = (q / 1000).toFixed(3).replace(/\.?0+$/, ''); return kg + ' kg'; }
    if (u === 'ml' && q >= 1000) { const lit = (q / 1000).toFixed(3).replace(/\.?0+$/, ''); return lit + ' lit'; }
    if (u === 'bottle') return q + (q > 1 ? ' bottles' : ' bottle');
    if (u === 'bag') return q + (q > 1 ? ' bags' : ' bag');
    if (u === 'piece') return q + (q > 1 ? ' pieces' : ' piece');
    if (u === 'jar') return q + (q > 1 ? ' jars' : ' jar');
    return q + ' ' + u;
  };

  const originalRenderInvoiceView = window.renderInvoiceView;
  window.renderInvoiceView = async function(content, id) {
    await originalRenderInvoiceView.call(this, content, id);
    const rows = content.querySelectorAll('#print-area tbody tr');
    const items = DB.invoice_items.filter(i => i.invoice_id === id);
    rows.forEach((row, index) => {
      if (items[index]) {
        const qtyCell = row.children[1];
        if (qtyCell) qtyCell.innerText = fmtInvQty(items[index].qty, items[index].unit);
      }
    });
  };

  const originalInvoicePDF = window.invoicePDF;
  window.invoicePDF = async function(inv, items, cust) {
    const formattedItems = items.map(i => ({ ...i, qty: fmtInvQty(i.qty, i.unit) }));
    await originalInvoicePDF(inv, formattedItems, cust);
  };

  const originalPrintViaBluetooth = window.printViaBluetooth;
  window.printViaBluetooth = async function(inv, items, cust) {
    const formattedItems = items.map(i => ({ ...i, qty: fmtInvQty(i.qty, i.unit) }));
    await originalPrintViaBluetooth(inv, formattedItems, cust);
  };

  const originalPrintThermalReceipt = window.printThermalReceipt;
  window.printThermalReceipt = async function(inv, items, cust) {
    const formattedItems = items.map(i => ({ ...i, qty: fmtInvQty(i.qty, i.unit) }));
    await originalPrintThermalReceipt(inv, formattedItems, cust);
  };

  const originalInvoiceMessage = window.invoiceMessage;
  window.invoiceMessage = function(name, inv, total, due, shareToken) {
    return originalInvoiceMessage(name, inv, total, due, shareToken);
  };
})();

<script>
// ==========================================
// SCRIPT K: SHOP HEALTH PAGE
// Profit   Loss   Dues   Stock   Expenses — all in one view
// ==========================================
(function() {
  'use strict';

  let rangePreset = 'all';
  let customFrom = '';
  let customTo = '';
  let includeSupplierDue = true;
  let chartType = 'bar';
  let expensesCache = [];
  let activeChart = null;

  async function loadExpenses() {
    try {
      const { data, error } = await sb.from('expenses').select('*');
      if (!error && data) expensesCache = data;
    } catch (e) { console.warn('shop-health expenses', e); }
  }

  function rangeFor(preset, cf, ct) {
    const today = todayStr();
    if (preset === 'today') return { from: today, to: today };
    if (preset === 'week') {
      const d = new Date(); const day = d.getDay() || 7;
      const mon = new Date(d); mon.setDate(d.getDate() - day + 1);
      return { from: mon.toISOString().slice(0,10), to: today };
    }
    if (preset === 'month') {
      const first = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().slice(0,10);
      return { from: first, to: today };
    }
    if (preset === 'year') return { from: new Date().getFullYear()+'-01-01', to: today };
    if (preset === 'custom') return { from: cf || '0000-01-01', to: ct || '9999-12-31' };
    return { from: '0000-01-01', to: '9999-12-31' };
  }

  function prevRangeFor(preset, from, to) {
    if (preset === 'all') return null;
    const f = new Date(from), t = new Date(to);
    if (preset === 'today') { f.setDate(f.getDate()-1); t.setDate(t.getDate()-1); }
    else if (preset === 'week') { f.setDate(f.getDate()-7); t.setDate(t.getDate()-7); }
    else if (preset === 'month' || preset === 'custom') {
      const days = Math.max(0, Math.round((t - f) / 86400000));
      t.setTime(f.getTime() - 86400000);
      f.setTime(t.getTime() - days * 86400000);
    }
    else if (preset === 'year') { f.setFullYear(f.getFullYear()-1); t.setFullYear(t.getFullYear()-1); }
    return { from: f.toISOString().slice(0,10), to: t.toISOString().slice(0,10) };
  }

  function metricsFor(from, to, withSupDue) {
    const invs = DB.invoices.filter(i => { const d = txDate(i,'invoice_date'); return d >= from && d <= to; });
    const grossSales = invs.reduce((s,i) => s + Number(i.total||0), 0);
    const rets = DB.returns.filter(r => { const d = txDate(r,'return_date'); return d >= from && d <= to; });
    const totalReturns = rets.reduce((s,r) => s + Number(r.amount||0), 0);
    const netSales = grossSales - totalReturns;
    const bills = DB.supplier_invoices.filter(b => { const d = txDate(b,'bill_date'); return d >= from && d <= to; });
    const totalPurchases = bills.reduce((s,b) => s + Number(b.total||0), 0);
    const exps = expensesCache.filter(e => { const d = txDate(e,'expense_date'); return d >= from && d <= to; });
    const totalExpenses = exps.reduce((s,e) => s + Number(e.amount||0), 0);
    const customerDue = DB.customers.reduce((s,c) => s + Number(c.due||0), 0);
    let supplierDue = 0;
    DB.suppliers.forEach(s => { try { supplierDue += Number(supplierTotals(s.id).total_due || 0); } catch(e) {} });
    let stockValue = 0;
    DB.products.forEach(p => { stockValue += (Number(p.stock||0) * Number(p.cost||0)); });
    let profit = netSales - totalPurchases + stockValue - totalExpenses;
    if (withSupDue) profit -= supplierDue;
    const margin = netSales > 0 ? (profit / netSales) * 100 : 0;
    return { grossSales, totalReturns, netSales, totalPurchases, customerDue, supplierDue, stockValue, totalExpenses, profit, margin, invoiceCount: invs.length };
  }

  function pctBadge(cur, prev) {
    if (prev === null || prev === undefined || prev === '') return '';
    const p = Number(prev), c = Number(cur);
    if (p === 0 && c === 0) return '';
    if (p === 0) return '<span style="font-size:10px;color:#16a34a;font-weight:600">new</span>';
    const pct = ((c - p) / Math.abs(p)) * 100;
    const up = pct >= 0;
    return `<span style="font-size:10px;color:${up?'#16a34a':'#dc2626'};font-weight:600">${up?'▲':'▼'} ${Math.abs(pct).toFixed(1)}%</span>`;

      link.innerHTML = '🏥<div style="font-size:9px">Health</div>';
      const anchor = mnav.querySelector('a[href="#/myshop"]');
      if (anchor) mnav.insertBefore(link, anchor); else mnav.appendChild(link);
    }
  }

  async function renderShopHealth(content) {
    await loadExpenses();

    content.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="page-head">
          <div>

          </div>
          <div class="page-actions">
            <button class="btn btn-ghost" id="sh-print">Print</button>
            <button class="btn btn-primary" id="sh-pdf">PDF</button>

        <div class="card" style="display:flex;flex-direction:column;gap:12px">
          <div style="display:flex;gap:6px;flex-wrap:wrap" id="sh-range-row">

            <button class="btn btn-sm sh-range" data-r="today">Today</button>
            <button class="btn btn-sm sh-range" data-r="week">This Week</button>
            <button class="btn btn-sm sh-range" data-r="month">This Month</button>
            <button class="btn btn-sm sh-range" data-r="year">This Year</button>
            <button class="btn btn-sm sh-range" data-r="custom">Custom</button>
          </div>
          <div id="sh-custom" style="display:none;gap:8px;flex-wrap:wrap;align-items:end">
            <div><label class="label">From</label><input class="input" type="date" id="sh-from"></div>

            <div><label class="label">&nbsp;</label><button class="btn btn-primary btn-sm" id="sh-apply">Apply</button></div>
          </div>
          <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--s100);padding-top:12px">

            </label>

            <div style="display:flex;gap:4px">
              <button class="btn btn-sm sh-ctype" data-c="bar">📊 Bar</button>
              <button class="btn btn-sm sh-ctype" data-c="line">📈 Line</button>
            </div>
          </div>
        </div>

        <div class="card" id="sh-hero" style="text-align:center;padding:24px;border-width:2px"></div>
        <div style="text-align:center;font-size:12px;color:var(--s500);margin-top:-6px" id="sh-period"></div>

        <div class="grid-3" id="sh-metrics"></div>

        <div class="card">
          <h2 style="font-weight:600;margin-bottom:12px" id="sh-chart-title">Overview</h2>
          <div style="position:relative;height:340px"><canvas id="sh-chart"></canvas></div>
        </div>

        <div class="card" style="font-size:12px;color:var(--s500);line-height:1.7">
          <b style="color:var(--s700)">How Profit is calculated:</b><br>
          Profit = Net Sales (Sales − Returns) − Purchases + Stock Value − Expenses${includeSupplierDue ? ' − Supplier Due' : ''}<br>
          <span style="font-size:11px;color:var(--s400)">Note: Customer Due, Supplier Due &amp; Stock Value are live (not filtered by date).</span>
        </div>
      </div>
    `;

    syncRange();
    syncChartType();
    content.querySelector('#sh-custom').style.display = rangePreset === 'custom' ? 'flex' : 'none';
    content.querySelector('#sh-supdue').checked = includeSupplierDue;

    content.querySelectorAll('.sh-range').forEach(b => b.onclick = () => {
      rangePreset = b.dataset.r;
      syncRange();
      content.querySelector('#sh-custom').style.display = rangePreset === 'custom' ? 'flex' : 'none';
      render();
    });
    content.querySelector('#sh-apply').onclick = () => {
      const f = content.querySelector('#sh-from').value;
      const t = content.querySelector('#sh-to').value;
      if (!f || !t) { toast('Pick both dates','error'); return; }
      if (f > t) { toast('From cannot be after To','error'); return; }
      customFrom = f; customTo = t;
      render();
    };
    content.querySelector('#sh-supdue').onchange = e => { includeSupplierDue = e.target.checked; render(); };
    content.querySelectorAll('.sh-ctype').forEach(b => b.onclick = () => {
      chartType = b.dataset.c;
      syncChartType();
      render();
    });

    render();

    function syncRange() {
      content.querySelectorAll('.sh-range').forEach(b => {
        const on = b.dataset.r === rangePreset;
        b.classList.toggle('btn-primary', on);
        b.classList.toggle('btn-ghost', !on);
      });
    }
    function syncChartType() {
      content.querySelectorAll('.sh-ctype').forEach(b => {
        const on = b.dataset.c === chartType;
        b.classList.toggle('btn-primary', on);
        b.classList.toggle('btn-ghost', !on);
      });
    }

    function render() {
      const { from, to } = rangeFor(rangePreset, customFrom, customTo);
      const m = metricsFor(from, to, includeSupplierDue);
      const prevR = prevRangeFor(rangePreset, from, to);
      const mPrev = prevR ? metricsFor(prevR.from, prevR.to, includeSupplierDue) : null;

      renderHero(m);
      renderMetrics(m, mPrev);
      renderChart(m, from, to);

      content.querySelector('#sh-period').textContent = rangePreset === 'all'
        ? 'Showing: All Time'
        : `Showing: ${fmtDate(from)} to ${fmtDate(to)}`;

      content.querySelector('#sh-print').onclick = () => doReport(m, 'print');
      content.querySelector('#sh-pdf').onclick = () => doReport(m, 'pdf');
    }

    function renderHero(m) {
      const hero = content.querySelector('#sh-hero');
      const isP = m.profit >= 0;
      const color = isP ? '#15803d' : '#dc2626';
      const bg = isP ? '#f0fdf4' : '#fef2f2';
      const border = isP ? '#bbf7d0' : '#fecaca';
      hero.style.background = bg;
      hero.style.borderColor = border;
      hero.innerHTML = `
        <div style="font-size:11px;color:${color};font-weight:700;letter-spacing:1.5px">${isP ? 'IN PROFIT' : 'IN LOSS'}</div>
        <div style="font-size:38px;font-weight:800;color:${color};margin:8px 0;line-height:1.1">${rs(Math.abs(m.profit))}</div>
        <div style="font-size:14px;color:var(--s600)">Margin: <b style="color:${color}">${m.margin.toFixed(1)}%</b> &nbsp; &nbsp; ${m.invoiceCount} invoice${m.invoiceCount===1?'':'s'}</div>
        ${!isP
          ? `<div style="margin-top:10px;font-size:12px;color:var(--s600)">You need <b style="color:${color}">${rs(Math.abs(m.profit))}</b> more sales to break even</div>`
          : `<div style="margin-top:10px;font-size:12px;color:var(--s600)">Keep it up! 🎉</div>`}
      `;
    }

    function renderMetrics(m, mp) {
      const grid = content.querySelector('#sh-metrics');
      const cards = [
        { lbl: 'Net Sales', txt: rs(m.netSales), num: m.netSales, prev: mp?.netSales, col: '#16a34a', sub: `Gross ${rs(m.grossSales)} − Returns ${rs(m.totalReturns)}` },
        { lbl: 'Purchases', txt: rs(m.totalPurchases), num: m.totalPurchases, prev: mp?.totalPurchases, col: '#c79a28' },
        { lbl: 'Customer Due', txt: rs(m.customerDue), num: m.customerDue, live: true, col: '#2563eb' },
        { lbl: 'Supplier Due', txt: rs(m.supplierDue), num: m.supplierDue, live: true, col: '#dc2626' },
        { lbl: 'Stock Value', txt: rs(m.stockValue), num: m.stockValue, live: true, col: '#7c3aed', sub: 'At cost price' },
        { lbl: 'Expenses', txt: rs(m.totalExpenses), num: m.totalExpenses, prev: mp?.totalExpenses, col: '#f97316' }
      ];
      grid.innerHTML = cards.map(c => {
        const badge = c.live
          ? '<span style="font-size:9px;color:var(--s400);font-weight:700;letter-spacing:0.5px">LIVE</span>'
          : (c.prev !== undefined && c.prev !== null ? pctBadge(c.num, c.prev) : '');
        return `
          <div class="card" style="border-left:4px solid ${c.col};padding:12px 14px">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:6px">
              <div style="font-size:10px;color:var(--s500);font-weight:700;text-transform:uppercase;letter-spacing:0.4px">${c.lbl}</div>
              ${badge}
            </div>
            <div style="font-size:19px;font-weight:700;color:${c.col};margin-top:5px">${c.txt}</div>
            ${c.sub ? `<div style="font-size:10px;color:var(--s400);margin-top:3px">${c.sub}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    function renderChart(m, from, to) {
      if (activeChart) { try { activeChart.destroy(); } catch(e) {} activeChart = null; }
      const canvas = content.querySelector('#sh-chart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      if (chartType === 'bar') {
        content.querySelector('#sh-chart-title').textContent = 'All Metrics — one view';
        const labels = ['Net Sales', 'Purchases', 'Cust Due', 'Sup Due', 'Stock', 'Expenses', m.profit >= 0 ? 'Profit' : 'Loss'];
        const values = [m.netSales, m.totalPurchases, m.customerDue, m.supplierDue, m.stockValue, m.totalExpenses, m.profit];
        const colors = ['#16a34a', '#c79a28', '#2563eb', '#dc2626', '#7c3aed', '#f97316', m.profit >= 0 ? '#15803d' : '#dc2626'];
        activeChart = new Chart(ctx, {
          type: 'bar',
          data: { labels, datasets: [{ data: values, backgroundColor: colors, borderRadius: 8, borderSkipped: false }] },
          options: {
            responsive: true, maintainAspectRatio: false, animation: false,
            plugins: {
              legend: { display: false },
              tooltip: { callbacks: { label: c => rs(c.parsed.y) } }
            },
            scales: { y: { beginAtZero: true, ticks: { callback: v => '₹' + Number(v).toLocaleString('en-IN') } } }
          }
        });
      } else {
        content.querySelector('#sh-chart-title').textContent = 'Sales vs Purchases vs Profit — monthly trend';
        const monthMap = {};
        const bump = k => { if (!monthMap[k]) monthMap[k] = { sales: 0, purchases: 0, expenses: 0 }; return monthMap[k]; };

        DB.invoices.forEach(i => { const d = txDate(i,'invoice_date'); if (d >= from && d <= to) bump(d.slice(0,7)).sales += Number(i.total||0); });
        DB.returns.forEach(r => { const d = txDate(r,'return_date'); if (d >= from && d <= to) bump(d.slice(0,7)).sales -= Number(r.amount||0); });
        DB.supplier_invoices.forEach(b => { const d = txDate(b,'bill_date'); if (d >= from && d <= to) bump(d.slice(0,7)).purchases += Number(b.total||0); });
        expensesCache.forEach(e => { const d = txDate(e,'expense_date'); if (d >= from && d <= to) bump(d.slice(0,7)).expenses += Number(e.amount||0); });

        const months = Object.keys(monthMap).sort();
        const salesArr = months.map(k => monthMap[k].sales);
        const purchArr = months.map(k => monthMap[k].purchases);
        const profitArr = months.map(k => monthMap[k].sales - monthMap[k].purchases - monthMap[k].expenses);

        activeChart = new Chart(ctx, {
          type: 'line',
          data: {
            labels: months,
            datasets: [
              { label: 'Sales', data: salesArr, borderColor: '#16a34a', backgroundColor: 'rgba(22,163,74,.1)', tension: .3, fill: true },
              { label: 'Purchases', data: purchArr, borderColor: '#c79a28', backgroundColor: 'rgba(199,154,40,.1)', tension: .3, fill: true },
              { label: 'Profit', data: profitArr, borderColor: '#7c3aed', backgroundColor: 'rgba(124,58,237,.1)', tension: .3, borderWidth: 3, fill: false }
            ]
          },
          options: {
            responsive: true, maintainAspectRatio: false, animation: false,
            plugins: {
              legend: { position: 'bottom' },
              tooltip: { callbacks: { label: c => c.dataset.label + ': ' + rs(c.parsed.y) } }
            },
            scales: { y: { ticks: { callback: v => '₹' + Number(v).toLocaleString('en-IN') } } }
          }
        });
      }
    }

    function doReport(m, mode) {
      const kpis = [
        ['Net Sales', rs(m.netSales)],
        ['Purchases', rs(m.totalPurchases)],
        ['Cust Due', rs(m.customerDue)],
        ['Sup Due', rs(m.supplierDue)],
        ['Stock', rs(m.stockValue)],
        ['Expenses', rs(m.totalExpenses)],
        [m.profit >= 0 ? 'Profit' : 'Loss', rs(m.profit)]
      ];
      const tables = [{
        title: 'Shop Health Detail',
        head: ['Metric', 'Value'],
        rows: [
          ['Gross Sales', rs(m.grossSales)],
          ['Returns', rs(m.totalReturns)],
          ['Net Sales', rs(m.netSales)],
          ['Purchases', rs(m.totalPurchases)],
          ['Customer Due (live)', rs(m.customerDue)],
          ['Supplier Due (live)', rs(m.supplierDue)],
          ['Stock Value (cost)', rs(m.stockValue)],
          ['Expenses', rs(m.totalExpenses)],
          [m.profit >= 0 ? 'PROFIT' : 'LOSS', rs(m.profit)],
          ['Margin %', m.margin.toFixed(1) + '%']
        ]
      }];
      if (mode === 'print') printReport('Shop Health', kpis, tables);
      else pdfReport('Shop Health', kpis, tables);
    }
  }

  const _origRoute = window.route;
  const _origRenderLayout = window.renderLayout;

  if (typeof _origRenderLayout === 'function') {
    window.renderLayout = function() {
      _origRenderLayout.apply(this, arguments);
      try { injectSidebarLink(); } catch(e) {}
    };
  }

  window.route = async function() {
    if (location.hash === '#/shop-health' && typeof SESSION !== 'undefined' && SESSION) {
      try {
        if (!DB.products.length && !DB.customers.length) { try { await syncDB(); } catch(e) {} }
        window.renderLayout();
        const content = document.getElementById('content');
        if (content) await renderShopHealth(content);
        return;
      } catch (e) {
        console.error('shop-health route', e);
        toast('Shop Health error: ' + e.message, 'error');
      }
    }
    return _origRoute.apply(this, arguments);
  };

  try { window.removeEventListener('hashchange', _origRoute); } catch(e) {}
  window.addEventListener('hashchange', window.route);

  let tries = 0;
  (function waitBoot() {
    tries++;
    if (tries > 30) return;
    if (location.hash !== '#/shop-health') return;
    if (typeof SESSION === 'undefined' || !SESSION) { setTimeout(waitBoot, 300); return; }
    window.route();
  })();
})();
</script>
<script>
// ==========================================
// SCRIPT L: RETURNS FIX
// ==========================================
(function() {
  window.renderReturns = function(content) {
    let selectedInvoice = null;

    content.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="page-head">
          <h1 style="font-size:22px;font-weight:700">Returns / Refunds</h1>
          <div class="page-actions">${reportButtonsHTML('ret')}</div>
        </div>

        <form id="rf" class="card" style="display:flex;flex-direction:column;gap:12px">
          ${dateTimeFieldHTML(null, '', 'Return Date')}
          <div><label class="label">Invoice</label>${searchSelectHTML('rt-inv-ss','Type invoice no or customer name...')}</div>
          <div id="rt-lines"></div>
          <div id="rt-fields" style="display:none;flex-direction:column;gap:12px">
            <div class="grid-3">
              <div><label class="label">Qty</label><input class="input" type="number" step="0.01" name="qty" value="1" id="rt-qty"></div>
              <div><label class="label">Refund ₹</label><input class="input" type="number" step="0.01" name="amount" value="0" id="rt-amt"></div>
              <div><label class="label">Reason</label><input class="input" name="reason"></div>
            </div>
          </div>
          <div style="display:flex;justify-content:flex-end">
            <button class="btn btn-primary" id="rt-submit" disabled>Record Return</button>
          </div>
        </form>

        <div class="card">
          <h2 style="font-weight:600;margin-bottom:10px">Recent returns</h2>
          <div id="rt-list"></div>
        </div>
      </div>`;

    function renderList() {
      const box = document.getElementById('rt-list');
      if (!DB.returns.length) {
        box.innerHTML = '<div style="text-align:center;padding:30px;color:var(--s400)"><p>No returns yet</p></div>';
        return;
      }
      box.innerHTML = DB.returns.map(r => {
        const inv  = DB.invoices.find(i => i.id === r.invoice_id);
        const cust = DB.customers.find(c => c.id === r.customer_id);
        return `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--s100);font-size:13px;gap:10px">
          <div style="flex:1;min-width:0">
            <div style="font-weight:500">${esc(r.product_name||'-')} × ${r.qty} ${esc(r.unit||'')}</div>
            <div style="color:var(--s500);font-size:11px">
              ${txDT(r,'return_date')}   Inv: ${esc(inv?.invoice_no||'-')}   ${esc(cust?.name||'Walk-in')}${r.reason ? '   '+esc(r.reason) : ''}
            </div>
          </div>
          <div style="color:var(--r600);font-weight:600;white-space:nowrap">${rs(r.amount)}</div>
          <button class="btn btn-ghost btn-sm" data-del-ret="${r.id}" style="color:var(--r600)">Del</button>
        </div>`;
      }).join('');

      box.querySelectorAll('[data-del-ret]').forEach(b => b.onclick = async () => {
        const ret = DB.returns.find(x => x.id === b.dataset.delRet);
        if (!ret) return;
        if (!confirmDlg('Delete this return?\n\n  Stock will be deducted again\n  Customer credit will be reversed', 'Confirm Delete')) return;

        if (ret.product_id) {
          const p = DB.products.find(x => x.id === ret.product_id);
          if (p) {
            const baseQty = Number(ret.base_qty) || Number(ret.qty) || 0;
            await sb.from('products').update({ stock: Number(p.stock) - baseQty }).eq('id', p.id);
          }
        }

        if (ret.customer_id) {
          const credits = DB.invoices.filter(i =>
            i.customer_id === ret.customer_id &&
            (i.invoice_no||'').startsWith('RET-') &&
            Math.abs(Number(i.total)) === Number(ret.amount)
          );
          if (credits.length) {
            credits.sort((a,b) => new Date(b.created_at||0) - new Date(a.created_at||0));
            await sb.from('invoices').delete().eq('id', credits[0].id);
          }
        }

        await sb.from('returns').delete().eq('id', ret.id);
        await syncDB();
        toast('Return deleted — stock & customer credit reversed','success');
        renderList();
      });
    }
    renderList();

    const invSS = $('#rt-inv-ss');
    mountSearchSelect(invSS, {
      items: DB.invoices
        .filter(i => !(i.invoice_no||'').startsWith('RET-') && !(i.invoice_no||'').startsWith('OLD-'))
        .map(invoiceToOption),
      allowAdd: false,
      onSelect: (opt) => {
        selectedInvoice = opt ? DB.invoices.find(i => i.id === opt.id) : null;
        renderLinePicker();
      }
    });

    function renderLinePicker() {
      const box = $('#rt-lines');
      const fieldsBox = $('#rt-fields');
      const submitBtn = $('#rt-submit');
      if (!selectedInvoice) { box.innerHTML=''; fieldsBox.style.display='none'; submitBtn.disabled=true; return; }

      const items = DB.invoice_items.filter(i => i.invoice_id === selectedInvoice.id);
      if (!items.length) {
        box.innerHTML = '<p style="color:var(--s400);font-size:13px">This invoice has no items</p>';
        fieldsBox.style.display='none'; submitBtn.disabled=true; return;
      }

      box.innerHTML = `<label class="label">Select item to return</label>
        <table style="font-size:13px"><thead><tr><th></th><th>Item</th><th style="text-align:right">Qty</th><th style="text-align:right">Rate</th></tr></thead>
        <tbody>${items.map(it => `<tr>
          <td><input type="radio" name="rt-line" value="${it.id}"
              data-pid="${it.product_id||''}"
              data-name="${esc(it.product_name)}"
              data-unit="${esc(it.unit||'')}"
              data-price="${it.price}"
              data-qty="${it.qty}"></td>
          <td>${esc(productLineLabel(it))}</td>
          <td style="text-align:right">${it.qty}</td>
          <td style="text-align:right">₹${it.price}</td>
        </tr>`).join('')}</tbody></table>`;

      fieldsBox.style.display = 'flex';
      submitBtn.disabled = false;
      $('#rt-qty').value = 1;
      $('#rt-amt').value = 0;

      $$('input[name="rt-line"]', box).forEach(r => r.onchange = e => {
        const price = Number(e.target.dataset.price)||0;
        const qty   = Number(e.target.dataset.qty)||1;
        $('#rt-qty').value = 1;
        $('#rt-amt').value = price;
        $('#rt-qty').max   = qty;
      });
      $('#rt-qty').oninput = e => {
        const r = document.querySelector('input[name="rt-line"]:checked'); if (!r) return;
        const price = Number(r.dataset.price)||0;
        $('#rt-amt').value = (Number(e.target.value)||0) * price;
      };
    }

    $('#rf').onsubmit = async e => {
      e.preventDefault();
      if (!selectedInvoice) { toast('Select an invoice','error'); return; }
      const r = document.querySelector('input[name="rt-line"]:checked');
      if (!r) { toast('Select an item','error'); return; }
      const dt = readDateTime(e.target); if (!dt) return;

      const fd = new FormData(e.target);
      const qty    = Number(fd.get('qty'))    || 0;
      const amount = Number(fd.get('amount')) || 0;
      if (qty <= 0)    { toast('Qty must be > 0','error'); return; }
      if (amount <= 0) { toast('Refund amount must be > 0','error'); return; }

      const productId   = r.dataset.pid;
      const productName = r.dataset.name;
      const unit        = r.dataset.unit;
      const p0          = DB.products.find(x => x.id === productId);
      const packSize    = (p0 && p0.dual) ? Number(p0.pack_size) : 1;
      const isPackUnit  = (p0 && p0.dual && unit === p0.pack_unit);
      const baseQty     = qty * (isPackUnit ? packSize : 1);

      const submitBtn = $('#rt-submit');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Saving...';

      const { error } = await sb.from('returns').insert({
        invoice_id:  selectedInvoice.id,
        customer_id: selectedInvoice.customer_id,
        product_id:  productId,
        product_name: productName,
        unit: unit,
        qty: qty,
        base_qty: baseQty,
        amount: amount,
        reason: fd.get('reason'),
        return_date: dt.date,
        tx_time: dt.time
      });
      if (error) {
        toast(error.message,'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Record Return';
        return;
      }

      if (p0) {
        const { data: freshProd } = await sb.from('products').select('stock').eq('id', p0.id).single();
        const currentStock = freshProd ? Number(freshProd.stock) : Number(p0.stock||0);
        const { error: stkErr } = await sb.from('products').update({ stock: currentStock + baseQty }).eq('id', p0.id);
        if (stkErr) console.warn('Stock restore failed:', stkErr.message);
      }

      if (selectedInvoice.customer_id) {
        const creditNo = 'RET-' + Date.now().toString().slice(-6);
        const { error: crErr } = await sb.from('invoices').insert({
          invoice_no: creditNo,
          customer_id: selectedInvoice.customer_id,
          subtotal: -amount,
          discount: 0,
          total: -amount,
          paid: 0,
          due: -amount,
          notes: 'Return refund from ' + selectedInvoice.invoice_no,
          invoice_date: dt.date,
          tx_time: dt.time
        });
        if (crErr) console.warn('Credit note failed:', crErr.message);
      }

      await syncDB();
      toast('Return recorded — stock restored & customer credited','success');
      route();
    };

    const kpis = [
      ['Total Returns',  DB.returns.length],
      ['Total Refunded', rs(DB.returns.reduce((s,r)=>s+Number(r.amount),0))]
    ];
    const tables = [{
      head:['Date','Invoice','Product','Qty','Refund','Reason'],
      rows: DB.returns.map(r => {
        const inv = DB.invoices.find(i => i.id === r.invoice_id);
        return [
          txDT(r,'return_date'),
          inv?.invoice_no || '-',
          r.product_name  || '-',
          r.qty + (r.unit ? ' '+r.unit : ''),
          rs(r.amount),
          r.reason || '-'
        ];
      })
    }];
    bindReport('ret','Returns Report',kpis,tables);
  };
})();
</script>

   Clean neutral backdrop + full glass everywhere.
   Paste right before </body>. Delete all previous theme CSS.

}
body {
  background-image:
    radial-gradient(120% 90% at 50% 0%,
      #ffffff 0%,
      #f4f6f9 45%,
      #e8ecf1 100%),
    radial-gradient(60% 40% at 15% 100%,
      rgba(200, 220, 235, 0.35) 0%, transparent 70%),
    radial-gradient(60% 40% at 85% 0%,
      rgba(220, 225, 240, 0.35) 0%, transparent 70%) !important;
  background-attachment: fixed !important;
  background-repeat: no-repeat !important;
}

}

/* ============================================================
   3. GLASS CARDS — blur + shine streak + fresnel rim

.modal,
.login-box,
