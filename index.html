/* ============================================================
   BASE LAYOUT — Restore structural CSS
   ============================================================ */
:root{--b50:#f0fdf4;--b100:#dcfce7;--b500:#22c55e;--b600:#16a34a;--b700:#15803d;--s50:#f8fafc;--s100:#f1f5f9;--s200:#e2e8f0;--s300:#cbd5e1;--s400:#94a3b8;--s500:#64748b;--s600:#475569;--s700:#334155;--s800:#1e293b;--r500:#ef4444;--r600:#dc2626;--am:#f59e0b;--gold:#c79a28}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--s50);color:var(--s800);font-size:14px;line-height:1.5}
a{color:var(--b700);text-decoration:none}
button,input,select,textarea{font:inherit}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;font-weight:500;border:0;cursor:pointer;transition:.15s;font-size:13px}
.btn:hover{opacity:.92}.btn:active{transform:scale(.97)}
.btn-primary{background:var(--b600);color:#fff}
.btn-ghost{background:var(--s100);color:var(--s700)}
.btn-gold{background:var(--gold);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.input{width:100%;padding:8px 12px;border-radius:10px;border:1px solid var(--s200);background:#fff;outline:none;font-size:13px}
.input:focus{border-color:var(--b500);box-shadow:0 0 0 3px var(--b100)}
.label{display:block;font-size:12px;font-weight:500;color:var(--s600);margin-bottom:4px}
.card{background:#fff;border-radius:14px;border:1px solid var(--s100);padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--s500);font-weight:500;padding:8px 6px;border-bottom:1px solid var(--s200);font-size:12px}
td{padding:10px 6px;border-bottom:1px solid var(--s100)}
tr:last-child td{border-bottom:0}
tr:hover td{background:var(--s50)}
.layout{display:flex;min-height:100vh}
.sidebar{width:220px;background:#fff;border-right:1px solid var(--s200);padding:16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.brand-logo{width:40px;height:40px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:28px}
.brand-logo img{width:100%;height:100%;object-fit:contain}
.brand-text{font-size:14px;font-weight:700;color:var(--b700);line-height:1.1;overflow:hidden;text-overflow:ellipsis}
.brand-text small{display:block;font-size:9px;color:var(--gold);font-weight:600;letter-spacing:.5px}
.nav{flex:1;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--s600);font-size:13px;transition:.15s}
.nav a:hover{background:var(--s50);color:var(--s800)}
.nav a.active{background:var(--b50);color:var(--b700);font-weight:500}
.main{flex:1;padding:20px;max-width:1200px;width:100%;margin:0 auto}
.mobile-header{display:none;padding:12px 16px;background:#fff;border-bottom:1px solid var(--s200);position:sticky;top:0;z-index:20;align-items:center;gap:12px}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal{background:#fff;border-radius:14px;padding:20px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto}
.toast{background:var(--s800);color:#fff;padding:10px 16px;border-radius:10px;margin-bottom:8px;font-size:13px;animation:slideIn .2s}
.toast-success{background:var(--b600)}.toast-error{background:var(--r500)}
#toast-root{position:fixed;bottom:20px;right:20px;z-index:200}
@keyframes slideIn{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.stat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:10px;font-size:18px}
.calc{position:fixed;bottom:20px;right:20px;background:#fff;border-radius:14px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.15);width:280px;z-index:150}
.calc-display{background:var(--s100);padding:12px;border-radius:10px;text-align:right;font-family:monospace;font-size:20px;margin-bottom:10px;overflow-x:auto;white-space:nowrap}
.calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc-keys button{padding:12px;border-radius:10px;background:var(--s100);border:0;cursor:pointer;font-weight:500;font-size:14px}
.calc-keys button.op{background:var(--b600);color:#fff}
.mini-stat{background:var(--s50);padding:10px;border-radius:10px}
.mini-stat .lbl{font-size:11px;color:var(--s500)}
.mini-stat .val{font-weight:700;margin-top:2px}
.page-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:4px}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}
.searchselect{position:relative}
.ss-dropdown{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--s200);border-radius:10px;max-height:280px;overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,.12);z-index:60;display:none;margin-top:4px}
.ss-dropdown.open{display:block}
.ss-item{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--s100);display:flex;justify-content:space-between;gap:8px;align-items:center}
.ss-item:last-child{border-bottom:0}
.ss-item:hover,.ss-item.active{background:var(--b50)}
.ss-item .sname{font-weight:500;font-size:13px}
.ss-item .ssub{font-size:11px;color:var(--s500);margin-top:1px}
.ss-item .smeta{text-align:right;font-size:11px;flex-shrink:0}
.ss-item .smeta .due{color:var(--r600);font-weight:600}
.ss-item .smeta .rat{color:var(--s600)}
.ss-empty{padding:14px;text-align:center;color:var(--s400);font-size:13px}
.ss-add{padding:10px;background:var(--s50);text-align:center;cursor:pointer;color:var(--b700);font-weight:600;font-size:13px;border-top:1px solid var(--s100)}
.ss-add:hover{background:var(--b50)}
.ss-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:0;cursor:pointer;color:var(--s400);font-size:15px;padding:4px;line-height:1}
.ss-clear:hover{color:var(--r600)}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f0fdf4,#dcfce7);padding:16px}
.login-box{max-width:380px;width:100%;display:flex;flex-direction:column;gap:14px}
.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--s500);flex-direction:column;gap:12px}
.spinner{width:36px;height:36px;border:3px solid var(--s200);border-top-color:var(--b600);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media print{body *{visibility:hidden!important}#print-area,#print-area *{visibility:visible!important}#print-area{position:absolute!important;left:0!important;top:0!important;width:100%!important;box-shadow:none!important;border:0!important;padding:0!important}body{background:#fff!important}#toast-root,#modal-root,#calc-root{display:none!important}}
@media(max-width:768px){.sidebar{display:none}.mobile-header{display:flex}.main{padding:12px}}
      
</style>
<style>
/* ============================================================
   DARK LIQUID GLASS — v3 (True Glass Effect)
   Strong light streaks, clear edges, visible wet reflection.
   ============================================================ */

:root {
  --b50:  #052e16;
  --b100: #064e3b;
  --b500: #4ade80;
  --b600: #22c55e;
  --b700: #86efac;
  --s50:  #0a0a0c;
  --s100: #141416;
  --s200: #1f1f22;
  --s300: #33333a;
  --s400: #6b6b73;
  --s500: #a1a1aa;
  --s600: #d4d4d8;
  --s700: #e4e4e7;
  --s800: #f4f4f5;
  --r500: #ef4444;
  --r600: #f87171;
  --am:   #fbbf24;
  --gold: #fbbf24;
}

/* ---------- 1. Rich animated backdrop so glass has something to blur ---------- */
html, body {
  background: #050506 !important;
  color: #e4e4e7 !important;
  min-height: 100vh;
}
body {
  background-image:
    radial-gradient(60% 50% at 15% 10%,
      rgba(34, 197, 94, 0.22) 0%,
      rgba(34, 197, 94, 0.05) 40%,
      transparent 70%),
    radial-gradient(50% 40% at 85% 15%,
      rgba(59, 130, 246, 0.18) 0%,
      rgba(59, 130, 246, 0.03) 40%,
      transparent 70%),
    radial-gradient(70% 50% at 50% 95%,
      rgba(139, 92, 246, 0.16) 0%,
      rgba(139, 92, 246, 0.02) 40%,
      transparent 75%),
    radial-gradient(40% 30% at 60% 40%,
      rgba(236, 72, 153, 0.08) 0%,
      transparent 60%),
    linear-gradient(180deg, #0b0b10 0%, #060609 50%, #020204 100%) !important;
  background-attachment: fixed !important;
  background-repeat: no-repeat !important;
}
body::before { display: none !important; }
body::after {
  content: "";
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: 0.04;
  background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}
.layout { position: relative; z-index: 1; }
.layout, .layout > div, .main { background: transparent !important; }

/* ============================================================
   2. TRUE GLASS CARDS
   - Heavy backdrop blur to distort the blobs behind
   - Clear top-to-bottom light gradient (the "glass surface")
   - Bright white edge highlight (top-left freshnel)
   - Inner shadow (bottom edge darkening = glass thickness)
   - Strong outer shadow for lift
   ============================================================ */
.card,
.modal,
.login-box,
.calc,
.ss-dropdown {
  position: relative;
  border-radius: 22px !important;
  background:
    /* Layer 1: bright top reflection */
    linear-gradient(160deg,
      rgba(255, 255, 255, 0.16) 0%,
      rgba(255, 255, 255, 0.06) 25%,
      rgba(255, 255, 255, 0.02) 55%,
      rgba(255, 255, 255, 0.00) 100%),
    /* Layer 2: colored tint for depth */
    linear-gradient(180deg,
      rgba(30, 41, 59, 0.55) 0%,
      rgba(15, 20, 30, 0.65) 100%),
    /* Layer 3: base translucent glass */
    rgba(20, 22, 28, 0.55) !important;

  backdrop-filter: blur(32px) saturate(180%) brightness(1.08) !important;
  -webkit-backdrop-filter: blur(32px) saturate(180%) brightness(1.08) !important;

  /* Clear glass edge — bright on top, dimmer on bottom */
  border-top: 1px solid rgba(255, 255, 255, 0.22) !important;
  border-left: 1px solid rgba(255, 255, 255, 0.12) !important;
  border-right: 1px solid rgba(255, 255, 255, 0.06) !important;
  border-bottom: 1px solid rgba(255, 255, 255, 0.04) !important;

  color: #e4e4e7 !important;
  box-shadow:
    /* Outer drop shadow — lifts the glass off the page */
    0 1px 0 rgba(255, 255, 255, 0.06) inset,
    0 2px 4px rgba(0, 0, 0, 0.4),
    0 12px 32px rgba(0, 0, 0, 0.55),
    0 32px 64px rgba(0, 0, 0, 0.35),
    /* Top rim light (bright) */
    inset 0 1px 0 rgba(255, 255, 255, 0.25),
    /* Bottom inner shadow (glass thickness) */
    inset 0 -1px 0 rgba(0, 0, 0, 0.4),
    inset 0 -2px 8px rgba(0, 0, 0, 0.2) !important;

  overflow: hidden;
}

/* Glass shine streak — bright diagonal reflection */
.card::before,
.modal::before,
.login-box::before {
  content: "";
  position: absolute;
  top: -10%;
  left: -30%;
  width: 80%;
  height: 120%;
  background: linear-gradient(115deg,
    rgba(255, 255, 255, 0) 0%,
    rgba(255, 255, 255, 0.10) 30%,
    rgba(255, 255, 255, 0.20) 45%,
    rgba(255, 255, 255, 0.10) 60%,
    rgba(255, 255, 255, 0) 100%);
  transform: rotate(-12deg);
  pointer-events: none;
  z-index: 1;
  filter: blur(0.5px);
}

/* Bottom corner reflectivity */
.card::after,
.modal::after,
.login-box::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 22px;
  pointer-events: none;
  z-index: 2;
  background:
    /* Top-left corner light hit */
    radial-gradient(60% 40% at 0% 0%,
      rgba(255, 255, 255, 0.18) 0%,
      rgba(255, 255, 255, 0.02) 30%,
      transparent 55%),
    /* Bottom-right green rim light */
    radial-gradient(50% 35% at 100% 100%,
      rgba(74, 222, 128, 0.10) 0%,
      transparent 60%),
    /* Bottom-left subtle ambient */
    radial-gradient(40% 30% at 0% 100%,
      rgba(59, 130, 246, 0.06) 0%,
      transparent 60%);
}

/* Make card contents sit above the shine layers */
.card > *,
.modal > *,
.login-box > * {
  position: relative;
  z-index: 3;
}

/* Card hover — glass lifts and rim lights up */
.card {
  transition: transform 0.32s cubic-bezier(0.175, 0.885, 0.32, 1.275),
              box-shadow 0.32s ease,
              border-color 0.32s ease !important;
}
.card:not(#print-area):not(.no-hover-card):hover {
  transform: translateY(-6px) !important;
  border-top-color: rgba(255, 255, 255, 0.35) !important;
  border-left-color: rgba(255, 255, 255, 0.20) !important;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.30),
    inset 0 -1px 0 rgba(0, 0, 0, 0.4),
    0 2px 4px rgba(0, 0, 0, 0.4),
    0 20px 48px rgba(0, 0, 0, 0.6),
    0 0 0 1px rgba(74, 222, 128, 0.20),
    0 0 48px rgba(34, 197, 94, 0.20) !important;
  z-index: 10;
}

/* ============================================================
   3. Sidebar — same true-glass treatment
   ============================================================ */
.sidebar {
  background:
    linear-gradient(160deg,
      rgba(255, 255, 255, 0.08) 0%,
      rgba(255, 255, 255, 0.02) 40%,
      rgba(255, 255, 255, 0.00) 100%),
    linear-gradient(180deg,
      rgba(18, 20, 28, 0.85) 0%,
      rgba(8, 8, 12, 0.92) 100%) !important;
  backdrop-filter: blur(32px) saturate(160%) !important;
  -webkit-backdrop-filter: blur(32px) saturate(160%) !important;
  border: 0 !important;
  border-right: 1px solid rgba(255, 255, 255, 0.08) !important;
  box-shadow:
    6px 0 30px rgba(0, 0, 0, 0.6),
    inset -1px 0 0 rgba(255, 255, 255, 0.04),
    inset 1px 0 0 rgba(255, 255, 255, 0.06) !important;
}
.mobile-header {
  background: rgba(12, 14, 20, 0.92) !important;
  backdrop-filter: blur(32px) saturate(160%) !important;
  -webkit-backdrop-filter: blur(32px) saturate(160%) !important;
  border: 0 !important;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06) !important;
}
#mobile-nav {
  background: rgba(12, 14, 20, 0.94) !important;
  backdrop-filter: blur(32px) saturate(160%) !important;
  -webkit-backdrop-filter: blur(32px) saturate(160%) !important;
  border: 0 !important;
  border-top: 1px solid rgba(255, 255, 255, 0.08) !important;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06) !important;
}

/* ---------- Sidebar nav pills ---------- */
.nav a {
  border-radius: 999px !important;
  color: #a1a1aa !important;
  transition: all 0.24s cubic-bezier(0.32, 0.72, 0, 1);
  border: 1px solid transparent;
}
.nav a:hover {
  background: linear-gradient(180deg,
    rgba(255, 255, 255, 0.10) 0%,
    rgba(255, 255, 255, 0.03) 100%) !important;
  border: 1px solid rgba(255, 255, 255, 0.12) !important;
  color: #f4f4f5 !important;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.15),
    0 4px 14px rgba(0, 0, 0, 0.4) !important;
}
.nav a.active {
  background: linear-gradient(180deg,
    rgba(34, 197, 94, 0.35) 0%,
    rgba(22, 163, 74, 0.18) 100%) !important;
  border: 1px solid rgba(74, 222, 128, 0.4) !important;
  color: #bbf7d0 !important;
  font-weight: 600 !important;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.25),
    0 4px 16px rgba(34, 197, 94, 0.30),
    0 0 32px rgba(34, 197, 94, 0.18) !important;
}

/* ============================================================
   4. Inputs (glass field)
   ============================================================ */
.input, input.input, select.input, textarea.input {
  background:
    linear-gradient(180deg,
      rgba(255, 255, 255, 0.05) 0%,
      rgba(255, 255, 255, 0.01) 100%),
    rgba(10, 12, 18, 0.55) !important;
  border-top: 1px solid rgba(255, 255, 255, 0.10) !important;
  border-left: 1px solid rgba(255, 255, 255, 0.06) !important;
  border-right: 1px solid rgba(255, 255, 255, 0.03) !important;
  border-bottom: 1px solid rgba(0, 0, 0, 0.4) !important;
  color: #f4f4f5 !important;
  border-radius: 14px !important;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.06),
    inset 0 -1px 2px rgba(0, 0, 0, 0.3) !important;
  transition: all 0.22s cubic-bezier(0.32, 0.72, 0, 1);
}
.input::placeholder { color: #52525b !important; }
.input:focus, input.input:focus, select.input:focus, textarea.input:focus {
  background:
    linear-gradient(180deg,
      rgba(255, 255, 255, 0.08) 0%,
      rgba(255, 255, 255, 0.02) 100%),
    rgba(10, 12, 18, 0.85) !important;
  border-color: rgba(74, 222, 128, 0.55) !important;
  box-shadow:
    0 0 0 4px rgba(34, 197, 94, 0.18),
    inset 0 1px 0 rgba(255, 255, 255, 0.10) !important;
  outline: none !important;
}
.label { color: #a1a1aa !important; font-weight: 600 !important; }

/* ============================================================
   5. Buttons (glassy pills with rim light)
   ============================================================ */
.btn {
  border-radius: 999px !important;
  transition: all 0.24s cubic-bezier(0.32, 0.72, 0, 1);
  font-weight: 600 !important;
}
.btn::before { display: none !important; }

.btn-primary {
  background: linear-gradient(180deg, #22c55e 0%, #16a34a 60%, #15803d 100%) !important;
  border: 1px solid rgba(255, 255, 255, 0.30) !important;
  color: #fff !important;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.40),
    inset 0 -1px 0 rgba(0, 0, 0, 0.25),
    0 4px 14px rgba(34, 197, 94, 0.35),
    0 12px 32px rgba(34, 197, 94, 0.20) !important;
}

.btn-ghost {
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.10) 0%, rgba(255, 255, 255, 0.03) 100%),
    rgba(24, 26, 32, 0.65) !important;
  border-top: 1px solid rgba(255, 255, 255, 0.14) !important;
  border-left: 1px solid rgba(255, 255, 255, 0.08) !important;
  border-right: 1px solid rgba(255, 255, 255, 0.05) !important;
  border-bottom: 1px solid rgba(0, 0, 0, 0.35) !important;
  color: #d4d4d8 !important;

}
.btn-ghost:hover {

    linear-gradient(180deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.05) 100%),

.btn-gold {

  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.40),

}

/* ============================================================
   6. Mini-stats (small glass tiles)
   ============================================================ */
.mini-stat {
  background:
    linear-gradient(160deg,
      rgba(255, 255, 255, 0.08) 0%,
      rgba(255, 255, 255, 0.02) 100%),
    rgba(14, 16, 22, 0.55) !important;

const fmt=n=>Number(n||0).toFixed(2);

  const num = Number(n||0); const neg = num < 0; const s = Math.abs(num).toFixed(2);
  const parts = s.split('.'); let intPart = parts[0]; const decPart = parts[1];
  if(intPart.length > 3){
    const last3 = intPart.slice(-3); const rest = intPart.slice(0, -3);
    intPart = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + last3;
  }
  return (neg?'-':'') + intPart + '.' + decPart;
}
const rs=n=>'₹'+inr(n);

const fmtDate=d=>{if(!d)return '-';const s=String(d).slice(0,10);return new Date(s).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});};
function fmtNum(n){ const v = Number(n||0); return v % 1 === 0 ? String(v) : v.toFixed(2); }

    const primaryIsPack = p.primary_unit === 'pack_unit';
    const primary = primaryIsPack ? packStr : baseStr;

    return { primary, secondary, stockLabel: primary, packStr, baseStr, fullText: primary + ' (' + secondary + ')',
      subline: fmtNum(p.pack_size) + ' ' + p.base_unit + ' / ' + p.pack_unit + (p.price_pack>0?' - ₹'+p.price_pack+'/'+p.pack_unit:'') + (p.price_base>0?' - ₹'+p.price_base+'/'+p.base_unit:''),

  }
  const str = fmtNum(p.stock) + ' ' + p.unit;
  return { primary: str, secondary: '', stockLabel: str, packStr: '', baseStr: str, fullText: str, subline: '₹' + p.price + '/' + p.unit, priceText: '₹' + p.price + '/' + p.unit };
}

  if(isLowStock(p)) return '<span style="background:#fee2e2;color:#b91c1c;font-size:10px;padding:2px 8px;border-radius:999px;font-weight:600">LOW</span>';

}

  if(line.dual && line.unit === line.pack_unit) return Number(line.qty) * Number(line.pack_size);

function getOverdue30(){
  const today = new Date(); let total = 0; const list = [];
  DB.invoices.forEach(inv => {
    if(Number(inv.due) <= 0) return;
    const d = new Date(txDate(inv,'invoice_date'));
    const ageDays = Math.floor((today - d) / (1000*60*60*24));
    if(ageDays >= 30){
      const c = DB.customers.find(x => x.id === inv.customer_id);
      total += Number(inv.due);
      list.push({ ...inv, ageDays, customerName: c?.name || 'Walk-in', customerPhone: c?.phone || '' });
    }
  });
  list.sort((a,b) => b.ageDays - a.ageDays);
  return { total, list };
}
function supplierTotals(sid){
  const sup = DB.suppliers.find(s=>s.id===sid);
  const bills = DB.supplier_invoices.filter(b=>b.supplier_id===sid);
  const pays = DB.supplier_payments.filter(p=>p.supplier_id===sid);
  const total_purchase = bills.reduce((s,b)=>s+Number(b.total),0);
  const bill_paid = bills.reduce((s,b)=>s+Number(b.paid||0),0);
  const extra_paid = pays.reduce((s,p)=>s+Number(p.amount),0);
  const total_paid = bill_paid + extra_paid;
  const opening = Number(sup?.opening_balance||0);
  const total_due = Math.max(0, opening + total_purchase - total_paid);
  return { total_purchase, total_paid, total_due, bill_paid, extra_paid, opening };
}

function compressImage(file, maxW = 1920, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('Could not read image'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('File read failed'));
    reader.readAsDataURL(file);
  });
}

function searchSelectHTML(id, placeholder){
  return `<div class="searchselect" id="${id}">
    <input type="text" class="input ss-input" placeholder="${placeholder||'Search...'}" autocomplete="off" style="padding-right:32px">
    <button type="button" class="ss-clear" style="display:none">X</button>
    <div class="ss-dropdown"></div>
    <input type="hidden" class="ss-value" value="">
  </div>`;
}
function mountSearchSelect(rootEl, opts){
  const input = rootEl.querySelector('.ss-input');
  const dropdown = rootEl.querySelector('.ss-dropdown');
  const clearBtn = rootEl.querySelector('.ss-clear');
  const hidden = rootEl.querySelector('.ss-value');
  let activeIdx = -1; let filtered = []; let items = opts.items || [];
  function render(query){
    const q = (query||'').toLowerCase().trim();
    filtered = items.filter(it => !q || it.searchText.toLowerCase().includes(q));
    let html = '';
    if(filtered.length === 0){ html = `<div class="ss-empty">No matches found</div>`; }
    else {
      html = filtered.map((it, i) => `<div class="ss-item ${i===activeIdx?'active':''}" data-idx="${i}"><div style="flex:1;min-width:0;overflow:hidden"><div class="sname">${esc(it.label)}</div>${it.sublabel?`<div class="ssub">${esc(it.sublabel)}</div>`:''}</div><div class="smeta">${it.dueText?`<div class="due">${esc(it.dueText)}</div>`:''}${it.ratingText?`<div class="rat">${esc(it.ratingText)}</div>`:''}</div></div>`).join('');
    }
    if(opts.allowAdd){ html += `<div class="ss-add">+ Add new customer</div>`; }
    dropdown.innerHTML = html;
    dropdown.classList.add('open');
    dropdown.querySelectorAll('.ss-item').forEach(el => { el.onclick = () => pick(parseInt(el.dataset.idx)); });
    const addEl = dropdown.querySelector('.ss-add');
    if(addEl) addEl.onclick = () => { dropdown.classList.remove('open'); if(opts.onAdd) opts.onAdd(); };
  }
  function pick(i){
    const it = filtered[i]; if(!it) return;
    hidden.value = it.id;
    input.value = it.label + (it.sublabel ? ' - '+it.sublabel : '');
    dropdown.classList.remove('open');
    clearBtn.style.display = 'block';
    if(opts.onSelect) opts.onSelect(it);
  }
  function clear(){ hidden.value = ''; input.value = ''; clearBtn.style.display = 'none'; if(opts.onSelect) opts.onSelect(null); }
  input.addEventListener('focus', () => render(input.value.replace(/ - .*$/,'').trim()));
  input.addEventListener('input', () => { activeIdx = -1; hidden.value = ''; clearBtn.style.display = input.value ? 'block' : 'none'; render(input.value); });
  input.addEventListener('keydown', e => {
    if(!dropdown.classList.contains('open')) return;
    if(e.key === 'ArrowDown'){ e.preventDefault(); activeIdx = Math.min(activeIdx+1, filtered.length-1); render(input.value); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); activeIdx = Math.max(activeIdx-1, 0); render(input.value); }
    else if(e.key === 'Enter'){ e.preventDefault(); if(activeIdx >= 0) pick(activeIdx); }
    else if(e.key === 'Escape'){ dropdown.classList.remove('open'); }
  });
  clearBtn.onclick = (e) => { e.stopPropagation(); clear(); input.focus(); };
  document.addEventListener('click', e => { if(!rootEl.contains(e.target)) dropdown.classList.remove('open'); });
  rootEl.getValue = () => hidden.value;
  rootEl.setItems = (newItems) => { items = newItems; };
  rootEl.setValue = (id) => { const it = items.find(x => x.id === id); if(it){ hidden.value = id; input.value = it.label + (it.sublabel ? ' - '+it.sublabel : ''); clearBtn.style.display = 'block'; } };
  rootEl.reset = clear;
  return rootEl;
}

/* ============ CALCULATOR ============ */
let calcOpen = false;
function toggleCalc(){
  calcOpen = !calcOpen;
  const root = $('#calc-root');
  if(!calcOpen){ root.innerHTML=''; return; }
  let val = '0';
  const render = () => {
    root.innerHTML = `<div class="calc"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-size:13px;font-weight:500">Calculator</span><button class="btn btn-ghost btn-sm" id="calc-close">X</button></div><div class="calc-display">${val}</div><div class="calc-keys">${['7','8','9','/','4','5','6','*','1','2','3','-','0','.','=','+','C','BK'].map(k=>{const op=['/','*','-','+','='].includes(k)?'op':'';const lbl = k==='BK'?'<':k;return `<button class="${op}" data-k="${k}">${lbl}</button>`;}).join('')}</div></div>`;
    $('#calc-close').onclick = toggleCalc;
    $$('#calc-root button[data-k]').forEach(b => b.onclick = () => push(b.dataset.k));
  };
  const push = k => {
    if(k==='C') val = '0';
    else if(k==='BK') val = val.length>1 ? val.slice(0,-1) : '0';
    else if(k==='='){ try{ val = String(Function('"use strict";return ('+val+')')()); }catch{ val='Err'; } }
    else val = val==='0' ? k : val+k;
    render();
  };
  render();
}

  };
  $('#btn-export').onclick = () => {
    const payload = { version: 1, exported_at: new Date().toISOString(), settings: SETTINGS, customers: DB.customers, products: DB.products, invoices: DB.invoices, invoice_items: DB.invoice_items, payments: DB.payments, suppliers: DB.suppliers, supplier_invoices: DB.supplier_invoices, supplier_payments: DB.supplier_payments, returns: DB.returns };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'backup-' + todayStr() + '.json'; a.click();
    URL.revokeObjectURL(url);
    toast('Backup downloaded','success');
  };
  $('#btn-restore').onclick = () => $('#restore-file').click();
  $('#restore-file').onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = async ev => {
      try{
        const data = JSON.parse(ev.target.result);
        if(!data.customers && !data.products && !data.invoices){ toast('Invalid backup file','error'); e.target.value=''; return; }
        if(!confirmDlg('This will ADD all rows from the backup file to Supabase.\n\nContinue?','Restore Backup')){ e.target.value=''; return; }
        toast('Restoring... please wait','info');
        const tables = ['customers','products','invoices','invoice_items','payments','suppliers','supplier_invoices','supplier_payments','returns'];
        for(const tbl of tables){
          if(Array.isArray(data[tbl]) && data[tbl].length){
            const { error } = await sb.from(tbl).insert(data[tbl]);
            if(error) console.warn(tbl, error.message);
          }
        }
        if(data.settings){ SETTINGS = { ...SETTINGS, ...data.settings }; await saveSettings(); }
        await syncDB();
        toast('Backup restored','success');
        route();
      }catch(err){ toast('Failed: '+err.message,'error'); }
      e.target.value = '';
    };
    r.readAsText(f);
  };
}

function renderCustomers(content){
  const list = DB.customers;

        <div style="flex:0 0 auto"><label class="label">&nbsp;</label><select class="input" id="cust-filter"><option value="">All</option><option value="due">Only with due</option><option value="nodue">Only cleared</option></select></div>

      <div class="card"><div style="overflow-x:auto"><table><thead><tr><th>Name</th><th>Phone</th><th>Joined</th><th>Rating</th><th style="text-align:right">Due</th><th></th></tr></thead><tbody id="cust-body"></tbody></table></div></div>
    </div>`;
  function filtered(){
    const q = ($('#cust-search').value||'').toLowerCase().trim();
    const sortBy = $('#cust-sort').value;
    const flt = $('#cust-filter').value;
    let arr = list.filter(c => {
      if(q && !(c.name.toLowerCase().includes(q) || (c.phone||'').includes(q))) return false;
      if(flt === 'due' && !(Number(c.due) > 0)) return false;
      if(flt === 'nodue' && Number(c.due) > 0) return false;
      return true;
    });
    if(sortBy === 'name') arr.sort((a,b)=>a.name.localeCompare(b.name));
    else if(sortBy === 'name-desc') arr.sort((a,b)=>b.name.localeCompare(a.name));
    else if(sortBy === 'due-desc') arr.sort((a,b)=>Number(b.due)-Number(a.due));
    else if(sortBy === 'due') arr.sort((a,b)=>Number(a.due)-Number(b.due));
    else if(sortBy === 'rating-desc') arr.sort((a,b)=>Number(b.rating)-Number(a.rating));
    return arr;
  }
  function renderTable(){
    const arr = filtered();
    $('#cust-count').textContent = arr.length + ' of ' + list.length + ' customers';
    $('#cust-body').innerHTML = arr.length === 0
      ? '<tr><td colspan="6" style="text-align:center;padding:40px"><div style="font-size:40px">(none)</div><p style="color:var(--s500);margin:8px 0">No customers match</p></td></tr>'
      : arr.map(c=>`<tr><td><a href="#/customer/${c.id}" style="font-weight:500">${esc(c.name)}</a></td><td>${c.phone?`<a href="tel:${c.phone}" style="color:var(--s600)">${esc(c.phone)}</a>`:'-'}</td><td>${fmtDate(c.joined_date)}</td><td><span style="color:var(--am)">${c.rating}</span></td><td style="text-align:right;font-weight:500;color:${Number(c.due)>0?'var(--r600)':'var(--s500)'}">${rs(c.due)}</td><td style="text-align:right;white-space:nowrap"><button class="btn btn-ghost btn-sm" data-edit="${c.id}">Edit</button><button class="btn btn-ghost btn-sm" data-del="${c.id}" style="color:var(--r600)">Del</button></td></tr>`).join('');
    $$('[data-del]').forEach(b=>b.onclick=async()=>{
      const c = DB.customers.find(x => x.id === b.dataset.del);
      if(!confirmDlg('Delete "'+(c?.name||'this customer')+'"?','Confirm Delete')) return;
      const { error } = await sb.from('customers').delete().eq('id', b.dataset.del);
      if(error){ toast(error.message,'error'); return; }
      await syncDB(); toast('Deleted','success'); renderTable();
    });
    $$('[data-edit]').forEach(b=>b.onclick=()=>{
      const c = DB.customers.find(x => x.id === b.dataset.edit);
      openCustomerFormModal(null, c);
    });
  }
  ['cust-search','cust-sort','cust-filter'].forEach(id => { $('#'+id).oninput = renderTable; $('#'+id).onchange = renderTable; });
  renderTable();
  $('#add-cust').onclick = () => openCustomerFormModal();
  const totalDue = list.reduce((s,c)=>s+Number(c.due),0);
  const totalBought = list.reduce((s,c)=>s+Number(c.total_bought),0);
  const totalPaid = list.reduce((s,c)=>s+Number(c.total_paid),0);
  const kpis = [['Total Customers',list.length],['Total Bought',rs(totalBought)],['Total Paid',rs(totalPaid)],['Total Due',rs(totalDue)]];
  const tables = [{head:['Name','Phone','Address','Joined','Rating','Bought','Paid','Due'],rows:list.map(c=>[c.name,c.phone||'-',c.address||'-',fmtDate(c.joined_date),c.rating,rs(c.total_bought),rs(c.total_paid),rs(c.due)])}];
  bindReport('cust','All Customers',kpis,tables);

function openCustomerFormModal(onCreated, existing){

      const p = DB.products.find(x => x.id === b.dataset.del);
      if(!confirmDlg('Delete "'+(p?.name||'product')+'"?','Confirm Delete')) return;
      const { error } = await sb.from('products').delete().eq('id', b.dataset.del);
      if(error){ toast(error.message,'error'); return; }
      await syncDB(); toast('Deleted','success'); renderGrid();
    });
    $$('[data-edit]',grid).forEach(b=>b.onclick=()=>{
      const p = DB.products.find(x => x.id === b.dataset.edit);

    });
  }
  ['prod-search','prod-cat','prod-sort','prod-filter'].forEach(id => { $('#'+id).oninput = renderGrid; $('#'+id).onchange = renderGrid; });
  $('#add-prod').onclick = () => openProductForm();
  renderGrid();
  const lowCount = list.filter(p=>isLowStock(p)).length;
  const outCount = list.filter(p=>isOutOfStock(p)).length;
  const kpis = [['Total Products',list.length],['Low Stock',lowCount],['Out of Stock',outCount]];
  const tables = [{head:['Product','Pack/Unit','Stock','Cost','Sell','Status'],rows:list.map(p=>{const d=productDisplay(p);const status = isOutOfStock(p)?'OUT':(isLowStock(p)?'LOW':'OK');const sell = p.dual?(p.price_base+'/'+p.base_unit+' - '+p.price_pack+'/'+p.pack_unit):(p.price+'/'+p.unit);return [p.name,d.subline,d.stockLabel,rs(p.cost),sell,status];})}];
  bindReport('prod','Stock Report',kpis,tables);
}

          <div><label class="label">Pack unit</label><select class="input" name="pack_unit">${PACK_UNITS.map(u=>`<option ${p.pack_unit===u?'selected':''}>${u}</option>`).join('')}</select></div>
        </div>
        <div style="margin-top:10px"><label class="label">1 <span class="pk-lbl">${p.pack_unit}</span> = <input class="input" type="number" step="0.01" name="pack_size" value="${p.pack_size||50}" style="display:inline-block;width:100px;margin:0 6px"> <span class="bs-lbl">${p.base_unit}</span></label></div>
        <div class="grid-2" style="margin-top:10px">
          <div><label class="label">Sell / base unit (₹)</label><input class="input" type="number" step="0.01" name="price_base" value="${p.price_base||0}"></div>
          <div><label class="label">Sell / pack (₹)</label><input class="input" type="number" step="0.01" name="price_pack" value="${p.price_pack||0}"></div>
          <div><label class="label">Cost / base unit (₹)</label><input class="input" type="number" step="0.01" name="cost" value="${p.cost||0}"></div>
          <div><label class="label">Stock (base unit)</label><input class="input" type="number" step="0.01" name="stock2" value="${p.stock||0}"></div>
          <div><label class="label">Low alert (base unit)</label><input class="input" type="number" name="low2" value="${p.low_stock_alert||5}"></div>
        </div>
        <div style="margin-top:10px"><label class="label">Primary display</label><select class="input" name="primary_unit"><option value="base_unit" ${p.primary_unit==='base_unit'?'selected':''}>Base unit first</option><option value="pack_unit" ${p.primary_unit==='pack_unit'?'selected':''}>Pack unit first</option></select></div>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="prf-save">${existing?'Update':'Save'}</button></div>
    </form>`, root => {
    const dualSel = root.querySelector('[name="dual"]');
    const singleB = root.querySelector('#single-block');
    const dualB = root.querySelector('#dual-block');
    dualSel.onchange = () => { const isDual = dualSel.value === 'yes'; singleB.style.display = isDual?'none':'block'; dualB.style.display = isDual?'block':'none'; };
    const bu = root.querySelector('[name="base_unit"]'); const pu = root.querySelector('[name="pack_unit"]');
    const upLbls = () => { root.querySelectorAll('.pk-lbl').forEach(e=>e.textContent=pu.value); root.querySelectorAll('.bs-lbl').forEach(e=>e.textContent=bu.value); };
    if(bu){ bu.onchange = upLbls; pu.onchange = upLbls; upLbls(); }
    root.querySelector('#prf').onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const isDual = fd.get('dual') === 'yes';
      const name = (fd.get('name')||'').trim();
      if(!name){ toast('Enter product name','error'); return; }
      let data;
      if(isDual){
        const ps = Number(fd.get('pack_size'))||1;
        if(ps <= 0){ toast('Pack size must be > 0','error'); return; }
        data = { name, category: fd.get('category')||'', dual: true, base_unit: fd.get('base_unit'), pack_unit: fd.get('pack_unit'), pack_size: ps, price_base: Number(fd.get('price_base'))||0, price_pack: Number(fd.get('price_pack'))||0, cost: Number(fd.get('cost'))||0, stock: Number(fd.get('stock2'))||0, low_stock_alert: Number(fd.get('low2'))||0, primary_unit: fd.get('primary_unit')||'base_unit', unit: null, price: null };
      } else {
        data = { name, category: fd.get('category')||'', dual: false, unit: fd.get('unit'), price: Number(fd.get('price'))||0, cost: Number(fd.get('cost'))||0, stock: Number(fd.get('stock1'))||0, low_stock_alert: Number(fd.get('low1'))||0, base_unit: null, pack_unit: null, pack_size: null, price_base: 0, price_pack: 0, primary_unit: 'base_unit' };
      }
      const btn = root.querySelector('#prf-save'); btn.disabled = true; btn.textContent = 'Saving...';
      let result;
      if(existing) result = await sb.from('products').update(data).eq('id', existing.id).select().single();
      else result = await sb.from('products').insert(data).select().single();
      if(result.error){ toast(result.error.message,'error'); btn.disabled = false; btn.textContent = existing?'Update':'Save'; return; }
      await syncDB();
      toast(existing?'Updated':'Added','success');
      closeModal(); route();
    };
  });
}

function renderInvoices(content){
  const list = DB.invoices;
  content.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="page-head"><h1 style="font-size:22px;font-weight:700">Invoices</h1><div class="page-actions"><a href="#/invoice/new" class="btn btn-primary">+ New Invoice</a>${reportButtonsHTML('inv')}</div></div>
      <div class="card" style="display:flex;gap:10px;flex-wrap:wrap;align-items:end">
        <div style="flex:2;min-width:200px"><label class="label">Search</label><input class="input" id="inv-search" placeholder="Invoice no, customer..."></div>
        <div style="flex:1;min-width:150px"><label class="label">Sort</label><select class="input" id="inv-sort"><option value="date-desc">Date (newest first)</option><option value="date">Date (oldest first)</option><option value="due-desc">Due (high first)</option><option value="total-desc">Total (high first)</option></select></div>
        <div style="flex:0 0 auto"><label class="label">&nbsp;</label><select class="input" id="inv-filter"><option value="">All</option><option value="due">Only with due</option><option value="paid">Fully paid</option></select></div>
      </div>
      <div id="inv-count" style="font-size:12px;color:var(--s500);padding:0 4px"></div>
      <div class="card" style="overflow-x:auto"><table><thead><tr><th>Invoice</th><th>Customer</th><th>Date</th><th style="text-align:right">Total</th><th style="text-align:right">Paid</th><th style="text-align:right">Due</th><th></th></tr></thead><tbody id="inv-body"></tbody></table></div>
    </div>`;
  function filtered(){
    const q = ($('#inv-search').value||'').toLowerCase().trim();
    const sortBy = $('#inv-sort').value;
    const flt = $('#inv-filter').value;
    let arr = list.filter(i => {
      const c = DB.customers.find(x => x.id === i.customer_id);
      const hay = (i.invoice_no+' '+(c?.name||'')+' '+(c?.phone||'')).toLowerCase();
      if(q && !hay.includes(q)) return false;
      if(flt === 'due' && !(Number(i.due) > 0)) return false;
      if(flt === 'paid' && Number(i.due) > 0) return false;
      return true;
    });
    if(sortBy === 'date-desc') arr.sort((a,b)=>txDate(b,'invoice_date').localeCompare(txDate(a,'invoice_date')));
    else if(sortBy === 'date') arr.sort((a,b)=>txDate(a,'invoice_date').localeCompare(txDate(b,'invoice_date')));
    else if(sortBy === 'due-desc') arr.sort((a,b)=>Number(b.due)-Number(a.due));
    else if(sortBy === 'total-desc') arr.sort((a,b)=>Number(b.total)-Number(a.total));
    return arr;
  }
  function renderTable(){
    const arr = filtered();
    $('#inv-count').textContent = arr.length + ' of ' + list.length + ' invoices';
    $('#inv-body').innerHTML = arr.length === 0
      ? '<tr><td colspan="7" style="text-align:center;padding:40px"><div style="font-size:40px">(none)</div><p style="color:var(--s500);margin:8px 0">No invoices match</p><a href="#/invoice/new" class="btn btn-primary">+ New Invoice</a></td></tr>'
      : arr.map(i=>{
          const c = DB.customers.find(x => x.id === i.customer_id);
          return `<tr><td><a href="#/invoice/${i.id}" style="font-weight:500">${i.invoice_no}</a></td><td>${esc(c?.name||'Walk-in')}</td><td>${txDT(i,'invoice_date')}</td><td style="text-align:right">${rs(i.total)}</td><td style="text-align:right;color:var(--b700)">${rs(i.paid)}</td><td style="text-align:right;color:${Number(i.due)>0?'var(--r600)':'var(--s400)'};font-weight:${Number(i.due)>0?'600':'400'}">${rs(i.due)}</td><td style="text-align:right;white-space:nowrap"><button class="btn btn-ghost btn-sm" data-del-inv="${i.id}" style="color:var(--r600)">Del</button></td></tr>`;
        }).join('');
    $$('[data-del-inv]').forEach(b=>b.onclick=async()=>{
      const inv = DB.invoices.find(x => x.id === b.dataset.delInv);
      if(!inv) return;
      const c = DB.customers.find(x => x.id === inv.customer_id);
      if(!confirmDlg('Delete invoice '+inv.invoice_no+' for ₹'+inr(inv.total)+'?\n\nCustomer: '+(c?.name||'Walk-in')+'\n\nStock will be restored.','Confirm Delete')) return;
      const items = DB.invoice_items.filter(x => x.invoice_id === inv.id);
      for(const it of items){
        const p = DB.products.find(x => x.id === it.product_id);
        if(p){ const back = lineDeductBaseQty(it); await sb.from('products').update({ stock: Number(p.stock) + back }).eq('id', p.id); }
      }
      await sb.from('invoices').delete().eq('id', inv.id);
      await syncDB();
      toast('Invoice deleted - stock restored','success');
      renderTable();
    });
  }
  ['inv-search','inv-sort','inv-filter'].forEach(id => { $('#'+id).oninput = renderTable; $('#'+id).onchange = renderTable; });
  renderTable();
  const total = list.reduce((s,i)=>s+Number(i.total),0);
  const paid = list.reduce((s,i)=>s+Number(i.paid),0);
  const due = list.reduce((s,i)=>s+Number(i.due),0);
  const kpis = [['Total Invoices',list.length],['Total Sales',rs(total)],['Total Paid',rs(paid)],['Total Due',rs(due)]];
  const tables = [{head:['Invoice','Customer','Date','Subtotal','Discount','Total','Paid','Due'],rows:list.map(i=>{const c=DB.customers.find(x=>x.id===i.customer_id);return [i.invoice_no,c?.name||'Walk-in',txDT(i,'invoice_date'),rs(i.subtotal),rs(i.discount),rs(i.total),rs(i.paid),rs(i.due)];})}];
  bindReport('inv','Invoice Register',kpis,tables);
}

function renderNewInvoice(content){
  const ps = DB.products;
  let lines = [];
  content.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="page-head"><h1 style="font-size:22px;font-weight:700">New Invoice</h1><div class="page-actions">${reportButtonsHTML('nv')}</div></div>
      <div class="card" style="display:flex;flex-direction:column;gap:14px">
        ${dateTimeFieldHTML(null, '', 'Invoice Date')}
        <div><label class="label">Customer</label>${searchSelectHTML('nv-cust-ss','Type name or phone...')}<p style="font-size:11px;color:var(--s400);margin-top:4px">Leave empty for Walk-in</p></div>
        <div><label class="label">Add item</label>${searchSelectHTML('nv-prod-ss','Type product name or pack size...')}</div>
        <div id="nv-lines"></div>
        <div class="grid-3">
          <div><label class="label">Discount (₹)</label><input class="input" type="number" step="0.01" id="nv-disc" value="0"></div>
          <div><label class="label">Paid now (₹)</label><input class="input" type="number" step="0.01" id="nv-paid" value="0"></div>
          <div><label class="label">Notes</label><input class="input" id="nv-notes"></div>
        </div>
        <div id="nv-summary" style="background:var(--s50);padding:12px;border-radius:12px;display:flex;justify-content:space-between;font-size:13px;font-weight:500"></div>
        <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">
          <a href="#/invoices" class="btn btn-ghost">Cancel</a>
          <button id="nv-save-print" class="btn btn-ghost">Save &amp; Print</button>
          <button id="nv-save" class="btn btn-primary">Save Invoice</button>
        </div>
      </div>
    </div>`;
  const custSS = $('#nv-cust-ss');
  mountSearchSelect(custSS, { items: DB.customers.map(customerToOption), allowAdd: true,
    onAdd: () => { openCustomerFormModal(async (newC) => { await syncDB(); custSS.setItems(DB.customers.map(customerToOption)); custSS.setValue(newC.id); toast('Customer added & selected','success'); }); }
  });
  const prodSS = $('#nv-prod-ss');
  mountSearchSelect(prodSS, { items: ps.map(productToOption), allowAdd: false,
    onSelect: (opt) => { if(!opt) return; const p = ps.find(x => x.id === opt.id); if(!p) return; addProductLine(p); setTimeout(()=>prodSS.reset(), 50); }
  });
  function addProductLine(p){
    if(p.dual){
      const primaryUnit = p.primary_unit === 'pack_unit' ? p.pack_unit : p.base_unit;
      const priceForUnit = primaryUnit === p.pack_unit ? (Number(p.price_pack)||0) : (Number(p.price_base)||0);
      lines.push({ product_id:p.id, product_name:p.name, dual:true, base_unit:p.base_unit, pack_unit:p.pack_unit, pack_size:Number(p.pack_size)||1, price_base:Number(p.price_base)||0, price_pack:Number(p.price_pack)||0, unit:primaryUnit, qty:1, price:priceForUnit, total:priceForUnit });
    } else {
      lines.push({ product_id:p.id, product_name:p.name, dual:false, unit:p.unit, qty:1, price:Number(p.price)||0, total:Number(p.price)||0 });
    }
    renderLines();
  }
  function renderLines(){
    const box = $('#nv-lines');
    if(lines.length===0){ box.innerHTML='<p style="color:var(--s400);font-size:13px">No items added yet</p>'; }
    else{
      box.innerHTML = `<div style="overflow-x:auto"><table><thead><tr><th>Item</th><th>Qty</th><th>Unit</th><th>Price</th><th style="text-align:right">Total</th><th></th></tr></thead><tbody>${lines.map((l,i)=>{
        const unitCell = l.dual
          ? `<select class="input" data-i="${i}" data-f="unit" style="width:130px;padding:4px 6px"><option value="${l.pack_unit}" ${l.unit===l.pack_unit?'selected':''}>${l.pack_size} ${l.base_unit} (${l.pack_unit})</option><option value="${l.base_unit}" ${l.unit===l.base_unit?'selected':''}>${l.base_unit}</option></select>`
          : `<span style="font-size:12px;color:var(--s600)">${esc(l.unit||'')}</span>`;
        return `<tr><td>${esc(l.product_name)}</td><td><input class="input" type="number" step="0.01" data-i="${i}" data-f="qty" value="${l.qty}" style="width:70px;padding:4px 8px"></td><td>${unitCell}</td><td><input class="input" type="number" step="0.01" data-i="${i}" data-f="price" value="${l.price}" style="width:90px;padding:4px 8px"></td><td style="text-align:right">${rs(l.total)}</td><td><button class="btn btn-ghost btn-sm" data-del="${i}">X</button></td></tr>`;
      }).join('')}</tbody></table></div>`;
      $$('input[data-i]',box).forEach(inp=>inp.oninput=e=>{const i=+e.target.dataset.i,f=e.target.dataset.f;lines[i][f]=Number(e.target.value);lines[i].total=lines[i].qty*lines[i].price;renderLines();});
      $$('select[data-i]',box).forEach(sel=>sel.onchange=e=>{const i=+e.target.dataset.i;lines[i].unit=e.target.value;if(lines[i].dual){lines[i].price=(lines[i].unit===lines[i].pack_unit)?Number(lines[i].price_pack)||0:Number(lines[i].price_base)||0;}lines[i].total=lines[i].qty*lines[i].price;renderLines();});
      $$('[data-del]',box).forEach(b=>b.onclick=()=>{lines.splice(+b.dataset.del,1);renderLines();});
    }
    updateSummary();
  }
  function updateSummary(){
    const sub = lines.reduce((s,l)=>s+l.total,0);
    const d = Number($('#nv-disc').value)||0;
    const tt = Math.max(0,sub-d);
    const pp = Number($('#nv-paid').value)||0;
    const dd = Math.max(0,tt-pp);
    $('#nv-summary').innerHTML = `<div>Subtotal: ${rs(sub)}</div><div style="font-weight:700">Total: ${rs(tt)}</div><div style="color:var(--r600)">Due: ${rs(dd)}</div>`;
  }
  $('#nv-disc').oninput = updateSummary;
  $('#nv-paid').oninput = updateSummary;
  renderLines();
  async function saveInvoice(){
    if(lines.length===0){ toast('Add at least one item','error'); return null; }
    const sc = checkStock(lines);
    if(!sc.ok){ toast('Not enough stock: '+sc.productName+' - need '+fmtNum(sc.need)+' '+sc.unit,'error'); return null; }
    const dEl = document.querySelector('#content input[name="tx_date"]');
    const tEl = document.querySelector('#content input[name="tx_time"]');
    const dv = dEl ? dEl.value : '';
    const tv = (tEl && tEl.value ? tEl.value : '').trim();
    if(!dv){ toast('Please pick a date','error'); return null; }
    if(isFuture(dv)){ toast('Future dates not allowed','error'); return null; }
    const custId = custSS.getValue() || null;
    const disc = Number($('#nv-disc').value)||0;
    const paid = Number($('#nv-paid').value)||0;
    const notes = $('#nv-notes').value;
    const subtotal = lines.reduce((s,l)=>s+l.total,0);
    const total = Math.max(0,subtotal-disc);
    const due = Math.max(0,total-paid);
    const no = nextInvoiceNo();
    const invData = { invoice_no: no, customer_id: custId, subtotal, discount: disc, total, paid, due, notes, invoice_date: dv, tx_time: tv };
    const { data: inv, error: invErr } = await sb.from('invoices').insert(invData).select().single();
    if(invErr){ toast(invErr.message,'error'); return null; }
    const itemRows = lines.map(l=>({ invoice_id: inv.id, product_id: l.product_id, product_name: l.product_name, dual: l.dual||false, base_unit: l.base_unit||null, pack_unit: l.pack_unit||null, pack_size: l.pack_size||null, price_base: l.price_base||0, price_pack: l.price_pack||0, unit: l.unit||null, qty: l.qty, price: l.price, total: l.total }));
    await sb.from('invoice_items').insert(itemRows);
    for(const l of lines){
      const p = DB.products.find(x => x.id === l.product_id);
      if(p){ const ded = lineDeductBaseQty(l); await sb.from('products').update({ stock: Number(p.stock) - ded }).eq('id', p.id); }
    }
    await syncDB();
    return inv;
  }
  $('#nv-save').onclick = async () => {
    const btn = $('#nv-save'); btn.disabled = true; btn.textContent = 'Saving...';
    const inv = await saveInvoice();
    btn.disabled = false; btn.textContent = 'Save Invoice';
    if(inv){ toast('Invoice saved','success'); location.hash = '#/invoice/' + inv.id; }
  };
  $('#nv-save-print').onclick = async () => {
    const btn = $('#nv-save-print'); btn.disabled = true; btn.textContent = 'Saving...';
    const inv = await saveInvoice();
    btn.disabled = false; btn.textContent = 'Save & Print';
    if(!inv) return;
    const items = DB.invoice_items.filter(i => i.invoice_id === inv.id);
    const cust = DB.customers.find(c => c.id === inv.customer_id);
    const kpis = [['Invoice',inv.invoice_no],['Date',txDT(inv,'invoice_date')],['Customer',cust?.name||'Walk-in'],['Total',rs(inv.total)],['Paid',rs(inv.paid)],['Due',rs(inv.due)]];
    const tables = [{head:['Item','Qty','Rate','Amount'],rows:items.map(i=>[productLineLabel(i),i.qty,rs(i.price),rs(i.total)])}];
    setTimeout(()=>printReport('Invoice '+inv.invoice_no,kpis,tables),200);
    location.hash = '#/invoice/' + inv.id;
  };
}

        <div style="flex:1;min-width:150px"><label class="label">Sort</label><select class="input" id="pur-sort"><option value="date-desc">Date (newest first)</option><option value="date">Date (oldest first)</option><option value="due-desc">Balance (high first)</option></select></div>
        <div style="flex:0 0 auto"><label class="label">&nbsp;</label><select class="input" id="pur-filter"><option value="">All</option><option value="due">Only with balance</option><option value="paid">Fully paid</option></select></div>
      </div>
      <div class="grid-3" id="pur-stats"></div>
      <div id="pur-count" style="font-size:12px;color:var(--s500);padding:0 4px"></div>
      <div class="card" style="overflow-x:auto"><table><thead><tr><th>Bill No</th><th>Supplier</th><th>Date</th><th style="text-align:right">Total</th><th style="text-align:right">Paid</th><th style="text-align:right">Balance</th><th></th></tr></thead><tbody id="pur-body"></tbody></table></div>
    </div>`;
  function filtered(){
    const q = ($('#pur-search').value||'').toLowerCase().trim();
    const sortBy = $('#pur-sort').value;
    const flt = $('#pur-filter').value;
    let arr = list.filter(b => {
      const sup = DB.suppliers.find(s => s.id === b.supplier_id);
      const hay = ((b.bill_no||'')+' '+(sup?.name||'')).toLowerCase();
      if(q && !hay.includes(q)) return false;
      const bal = Number(b.total) - Number(b.paid);
      if(flt === 'due' && bal <= 0) return false;
      if(flt === 'paid' && bal > 0) return false;
      return true;
    });
    if(sortBy === 'date-desc') arr.sort((a,b)=>txDate(b,'bill_date').localeCompare(txDate(a,'bill_date')));
    else if(sortBy === 'date') arr.sort((a,b)=>txDate(a,'bill_date').localeCompare(txDate(b,'bill_date')));
    else if(sortBy === 'due-desc') arr.sort((a,b)=>(Number(b.total)-Number(b.paid))-(Number(a.total)-Number(a.paid)));
    return arr;
  }
  function renderTable(){
    const arr = filtered();
    $('#pur-count').textContent = arr.length + ' of ' + list.length + ' bills';
    $('#pur-body').innerHTML = arr.length === 0
      ? '<tr><td colspan="7" style="text-align:center;padding:40px"><div style="font-size:40px">(none)</div><p style="color:var(--s500);margin:8px 0">No purchases match</p><a href="#/suppliers" class="btn btn-primary">Go to suppliers</a></td></tr>'
      : arr.map(b=>{
          const sup = DB.suppliers.find(s => s.id === b.supplier_id);
          const bal = Number(b.total) - Number(b.paid);
          return `<tr><td>${esc(b.bill_no||'-')}</td><td><a href="#/supplier/${b.supplier_id}" style="font-weight:500">${esc(sup?.name||'-')}</a></td><td>${txDT(b,'bill_date')}</td><td style="text-align:right">${rs(b.total)}</td><td style="text-align:right;color:var(--b700)">${rs(b.paid)}</td><td style="text-align:right;color:${bal>0?'var(--r600)':'var(--s400)'};font-weight:${bal>0?'600':'400'}">${rs(bal)}</td><td style="text-align:right;white-space:nowrap"><button class="btn btn-ghost btn-sm" data-open-sup="${b.supplier_id}">View</button><button class="btn btn-ghost btn-sm" data-del-pur="${b.id}" style="color:var(--r600)">Del</button></td></tr>`;
        }).join('');
    $$('[data-open-sup]').forEach(b=>b.onclick=()=>{ location.hash = '#/supplier/' + b.dataset.openSup; });
    $$('[data-del-pur]').forEach(b=>b.onclick=async()=>{
      const bill = DB.supplier_invoices.find(x => x.id === b.dataset.delPur);
      if(!confirmDlg('Delete bill "'+(bill?.bill_no||'-')+'"?','Confirm Delete')) return;
      await sb.from('supplier_invoices').delete().eq('id', b.dataset.delPur);
      await syncDB();
      toast('Deleted','success'); renderTable();
    });
  }
  ['pur-search','pur-sort','pur-filter'].forEach(id => { $('#'+id).oninput = renderTable; $('#'+id).onchange = renderTable; });
  renderTable();
  const total = list.reduce((s,b)=>s+Number(b.total),0);
  const paid = list.reduce((s,b)=>s+Number(b.paid),0) + DB.supplier_payments.reduce((s,p)=>s+Number(p.amount),0);
  const due = Math.max(0, total - paid);
  $('#pur-stats').innerHTML = `<div class="card"><div style="font-size:11px;color:var(--s500)">Total Purchase</div><div style="font-size:18px;font-weight:700">${rs(total)}</div></div><div class="card"><div style="font-size:11px;color:var(--s500)">Total Paid</div><div style="font-size:18px;font-weight:700;color:var(--b700)">${rs(paid)}</div></div><div class="card"><div style="font-size:11px;color:var(--s500)">Total Due</div><div style="font-size:18px;font-weight:700;color:var(--r600)">${rs(due)}</div></div>`;
  const kpis = [['Total Purchase',rs(total)],['Total Paid',rs(paid)],['Total Due',rs(due)],['Total Bills',list.length]];
  const tables = [{head:['Bill No','Supplier','Date','Total','Paid','Balance'],rows:list.map(b=>{const sup=DB.suppliers.find(s=>s.id===b.supplier_id);return [b.bill_no||'-',sup?.name||'-',txDT(b,'bill_date'),rs(b.total),rs(b.paid),rs(Number(b.total)-Number(b.paid))];})}];
  bindReport('pur','Purchase Register',kpis,tables);
}

    box.innerHTML = `<label class="label">Select item to return</label><table style="font-size:13px"><thead><tr><th></th><th>Item</th><th style="text-align:right">Qty</th><th style="text-align:right">Rate</th></tr></thead><tbody>${items.map(it => `<tr><td><input type="radio" name="rt-line" value="${it.id}" data-pid="${it.product_id||''}" data-name="${esc(it.product_name)}" data-unit="${esc(it.unit||'')}" data-price="${it.price}" data-qty="${it.qty}"></td><td>${esc(productLineLabel(it))}</td><td style="text-align:right">${it.qty}</td><td style="text-align:right">₹${it.price}</td></tr>`).join('')}</tbody></table>`;

  bindReport('ret','Returns Report',kpis,tables);
}

/* ============ PROFIT & LOSS ============ */
function renderPnL(content){
  const today = todayStr();
  const firstOfMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().slice(0,10);
  content.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="page-head"><h1 style="font-size:22px;font-weight:700">Profit &amp; Loss</h1></div>
      <div class="card" style="display:flex;gap:10px;flex-wrap:wrap;align-items:end">
        <div><label class="label">From</label><input class="input" type="date" id="pnl-from" value="${firstOfMonth}" max="${today}"></div>
        <div><label class="label">To</label><input class="input" type="date" id="pnl-to" value="${today}" max="${today}"></div>
        <div><button class="btn btn-primary" id="pnl-load">Load</button></div>
        <div style="flex:1"></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-ghost" id="pnl-today">Today</button><button class="btn btn-ghost" id="pnl-month">This month</button><button class="btn btn-ghost" id="pnl-year">This year</button></div>
      </div>
      <div class="grid-4" id="pnl-stats"></div>
      <div class="card"><h2 style="font-weight:600;margin-bottom:12px">Product-wise Profit</h2><div style="overflow-x:auto"><table><thead><tr><th>Product</th><th style="text-align:right">Sold Qty</th><th style="text-align:right">Revenue</th><th style="text-align:right">Cost</th><th style="text-align:right">Profit</th><th style="text-align:right">Margin %</th></tr></thead><tbody id="pnl-body"></tbody></table></div></div>
      <div class="card" style="display:flex;gap:8px;flex-wrap:wrap"><button id="pnl-print" class="btn btn-ghost">Print</button><button id="pnl-pdf" class="btn btn-primary">PDF</button></div>
    </div>`;
  function compute(from, to){
    const invs = DB.invoices.filter(i => { const d = txDate(i,'invoice_date'); return d >= from && d <= to; });
    const perProduct = {};
    let totalRevenue = 0, totalCost = 0;
    invs.forEach(inv => {
      const items = DB.invoice_items.filter(x => x.invoice_id === inv.id);
      items.forEach(it => {
        const p = DB.products.find(x => x.id === it.product_id);
        const costPerBase = p ? Number(p.cost)||0 : 0;
        const baseQty = lineDeductBaseQty(it);
        const cost = baseQty * costPerBase;
        const rev = Number(it.total)||0;
        const key = it.product_id || it.product_name;
        if(!perProduct[key]) perProduct[key] = { name: it.product_name, revenue:0, cost:0, qty:0, unit: (p ? (p.dual ? p.base_unit : p.unit) : '') };
        perProduct[key].revenue += rev;
        perProduct[key].cost += cost;
        perProduct[key].qty += baseQty;
        totalRevenue += rev;
        totalCost += cost;
      });
    });
    const profit = totalRevenue - totalCost;
    const margin = totalRevenue > 0 ? (profit / totalRevenue) * 100 : 0;
    return { perProduct, totalRevenue, totalCost, profit, margin, count: invs.length };
  }
  function render(){
    const from = $('#pnl-from').value, to = $('#pnl-to').value;
    if(!from || !to){ toast('Pick both dates','error'); return; }
    if(from > to){ toast('From cannot be after To','error'); return; }
    const r = compute(from, to);
    $('#pnl-stats').innerHTML = `<div class="card"><div style="font-size:11px;color:var(--s500)">Revenue</div><div style="font-size:18px;font-weight:700">${rs(r.totalRevenue)}</div><div style="font-size:11px;color:var(--s500);margin-top:2px">${r.count} invoices</div></div><div class="card"><div style="font-size:11px;color:var(--s500)">Cost of Goods</div><div style="font-size:18px;font-weight:700;color:var(--s600)">${rs(r.totalCost)}</div></div><div class="card" style="background:${r.profit>=0?'#f0fdf4':'#fef2f2'}"><div style="font-size:11px;color:var(--s500)">Profit</div><div style="font-size:18px;font-weight:700;color:${r.profit>=0?'var(--b700)':'var(--r600)'}">${rs(r.profit)}</div></div><div class="card"><div style="font-size:11px;color:var(--s500)">Margin</div><div style="font-size:18px;font-weight:700">${r.margin.toFixed(1)}%</div></div>`;
    const rows = Object.values(r.perProduct).sort((a,b)=>(b.revenue-b.cost)-(a.revenue-a.cost));
    $('#pnl-body').innerHTML = rows.length === 0
      ? '<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--s500)">No sales in this range</td></tr>'
      : rows.map(x => { const p = x.revenue - x.cost; const m = x.revenue > 0 ? (p/x.revenue)*100 : 0; return `<tr><td>${esc(x.name)}</td><td style="text-align:right">${fmtNum(x.qty)} ${esc(x.unit)}</td><td style="text-align:right">${rs(x.revenue)}</td><td style="text-align:right;color:var(--s600)">${rs(x.cost)}</td><td style="text-align:right;font-weight:600;color:${p>=0?'var(--b700)':'var(--r600)'}">${rs(p)}</td><td style="text-align:right;color:${m>=0?'var(--b700)':'var(--r600)'}">${m.toFixed(1)}%</td></tr>`; }).join('');
    const kpis = [['From',from],['To',to],['Revenue',rs(r.totalRevenue)],['Cost',rs(r.totalCost)],['Profit',rs(r.profit)],['Margin',r.margin.toFixed(1)+'%']];
    const tables = [{title:'Product-wise Profit',head:['Product','Sold Qty','Revenue','Cost','Profit','Margin %'],rows: rows.map(x => { const p = x.revenue-x.cost; const m = x.revenue>0 ? (p/x.revenue)*100 : 0; return [x.name, fmtNum(x.qty)+' '+x.unit, rs(x.revenue), rs(x.cost), rs(p), m.toFixed(1)+'%']; })}];
    const title = 'Profit & Loss '+from+' to '+to;
    $('#pnl-print').onclick = () => printReport(title, kpis, tables);
    $('#pnl-pdf').onclick = () => pdfReport(title, kpis, tables);
  }
  $('#pnl-today').onclick = () => { $('#pnl-from').value = today; $('#pnl-to').value = today; render(); };
  $('#pnl-month').onclick = () => { $('#pnl-from').value = firstOfMonth; $('#pnl-to').value = today; render(); };
  $('#pnl-year').onclick = () => { $('#pnl-from').value = new Date().getFullYear()+'-01-01'; $('#pnl-to').value = today; render(); };
  $('#pnl-load').onclick = render;
  render();
}

  let invs=[], pays=[], purs=[];
  function setRange(from, to){ $('#r-from').value = from; $('#r-to').value = to; load(); }
  $('#r-quick-today').onclick = () => setRange(today, today);
  $('#r-quick-week').onclick = () => { const d = new Date(); const day = d.getDay() || 7; const mon = new Date(d); mon.setDate(d.getDate() - day + 1); setRange(mon.toISOString().slice(0,10), today); };
  $('#r-quick-month').onclick = () => setRange(firstOfMonth, today);
  $('#r-quick-year').onclick = () => setRange(new Date().getFullYear()+'-01-01', today);
  async function load(){
    const from = $('#r-from').value; const to = $('#r-to').value;
    if(!from || !to){ toast('Pick both dates','error'); return; }
    if(from > to){ toast('From cannot be after To','error'); return; }
    invs = DB.invoices.filter(i => { const d = txDate(i,'invoice_date'); return d >= from && d <= to; });
    pays = DB.payments.filter(p => { const d = txDate(p,'payment_date'); return d >= from && d <= to; });
    purs = DB.supplier_invoices.filter(s => { const d = txDate(s,'bill_date'); return d >= from && d <= to; });
    const totalSales = invs.reduce((s,i)=>s+Number(i.total),0);
    const totalPaid = pays.reduce((s,p)=>s+Number(p.amount),0) + invs.reduce((s,i)=>s+Number(i.paid),0);
    const totalDue = invs.reduce((s,i)=>s+Number(i.due),0);
    const totalPur = purs.reduce((s,p)=>s+Number(p.total),0);
    $('#r-stats').innerHTML = `<div class="card"><div style="font-size:11px;color:var(--s500)">Sales (${invs.length})</div><div style="font-size:18px;font-weight:700">${rs(totalSales)}</div></div><div class="card"><div style="font-size:11px;color:var(--s500)">Payments (${pays.length})</div><div style="font-size:18px;font-weight:700;color:var(--b700)">${rs(totalPaid)}</div></div><div class="card"><div style="font-size:11px;color:var(--s500)">Due</div><div style="font-size:18px;font-weight:700;color:var(--r600)">${rs(totalDue)}</div></div><div class="card"><div style="font-size:11px;color:var(--s500)">Purchases (${purs.length})</div><div style="font-size:18px;font-weight:700;color:var(--gold)">${rs(totalPur)}</div></div>`;
    $('#r-body').innerHTML = invs.length === 0 ? '<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--s500)">No invoices in this range</td></tr>' : invs.sort((a,b)=>txDate(b,'invoice_date').localeCompare(txDate(a,'invoice_date'))).map(i=>{const c = DB.customers.find(x => x.id === i.customer_id);return `<tr><td>${i.invoice_no}</td><td>${esc(c?.name||'-')}</td><td>${txDT(i,'invoice_date')}</td><td style="text-align:right">${rs(i.total)}</td><td style="text-align:right;color:var(--b700)">${rs(i.paid)}</td><td style="text-align:right;color:var(--r600)">${rs(i.due)}</td></tr>`;}).join('');
    $('#r-sales').onclick = () => pdfReport('Sales Report '+from+' to '+to, [['From',from],['To',to],['Total Sales',rs(totalSales)],['Total Paid',rs(totalPaid)],['Total Due',rs(totalDue)],['Count',invs.length]], [{head:['Invoice','Customer','Date','Total','Paid','Due'],rows:invs.map(i=>{const c=DB.customers.find(x=>x.id===i.customer_id);return [i.invoice_no,c?.name||'-',txDT(i,'invoice_date'),rs(i.total),rs(i.paid),rs(i.due)];})}]);
    $('#r-pay').onclick = () => pdfReport('Payment Report '+from+' to '+to, [['From',from],['To',to],['Total Paid',rs(pays.reduce((s,p)=>s+Number(p.amount),0))],['Count',pays.length]], [{head:['Customer','Date','Amount','Mode','Notes'],rows:pays.map(p=>{const c=DB.customers.find(x=>x.id===p.customer_id);return [c?.name||'-',txDT(p,'payment_date'),rs(p.amount),p.mode,p.notes||''];})}]);
    $('#r-pur').onclick = () => pdfReport('Purchase Report '+from+' to '+to, [['From',from],['To',to],['Total Purchase',rs(totalPur)],['Bills',purs.length]], [{head:['Bill','Supplier','Date','Total','Paid','Balance'],rows:purs.map(s=>{const sp=DB.suppliers.find(x=>x.id===s.supplier_id);return [s.bill_no||'-',sp?.name||'-',txDT(s,'bill_date'),rs(s.total),rs(s.paid),rs(Number(s.total)-Number(s.paid))];})}]);
    $('#r-all-print').onclick = () => {
      const tables = [
        {title:'Sales ('+invs.length+')',head:['Invoice','Customer','Date','Total','Paid','Due'],rows:invs.map(i=>{const c=DB.customers.find(x=>x.id===i.customer_id);return [i.invoice_no,c?.name||'-',txDT(i,'invoice_date'),rs(i.total),rs(i.paid),rs(i.due)];})},
        {title:'Payments ('+pays.length+')',head:['Customer','Date','Amount','Mode'],rows:pays.map(p=>{const c=DB.customers.find(x=>x.id===p.customer_id);return [c?.name||'-',txDT(p,'payment_date'),rs(p.amount),p.mode];})},
        {title:'Purchases ('+purs.length+')',head:['Bill','Supplier','Date','Total','Paid'],rows:purs.map(s=>{const sp=DB.suppliers.find(x=>x.id===s.supplier_id);return [s.bill_no||'-',sp?.name||'-',txDT(s,'bill_date'),rs(s.total),rs(s.paid)];})}
      ];
      printReport('Full Report '+from+' to '+to, [['From',from],['To',to],['Sales',rs(totalSales)],['Payments',rs(totalPaid)],['Due',rs(totalDue)],['Purchases',rs(totalPur)]], tables);
    };
  }
  $('#r-load').onclick = load;
  load();
}

/* ============ CUSTOMER PORTAL ============ */
async function renderPortal(token){
  $('#app').innerHTML = '<div class="loading"><div class="spinner"></div><div>Loading...</div></div>';
  try{
    const { data, error } = await sb.rpc('get_shared_customer_data', { t: token });
    if(error || !data){ $('#app').innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--s500)">Link not found.</div>'; return; }
    const c = data.customer; const invs = data.invoices || []; const pays = data.payments || []; const st = data.settings || {};
    const txs = [
      ...invs.map(i => ({ date: i.invoice_date, type: 'Invoice', ref: i.invoice_no, amount: Number(i.total), sign: -1 })),
      ...pays.map(p => ({ date: p.payment_date, type: 'Payment', ref: p.mode, amount: Number(p.amount), sign: 1 }))
    ].sort((a,b) => b.date.localeCompare(a.date));
    const upi = st.upi || '';
    const owner = st.owner_name || 'YOUR_SHOP_NAME';
    $('#app').innerHTML = `
      <div style="min-height:100vh;background:var(--s50);padding:16px">
        <div style="max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px">
          <div class="card" style="text-align:center">
            <div style="display:flex;justify-content:center;margin-bottom:6px">${st.logo?`<img src="${st.logo}" style="width:56px;height:56px;object-fit:contain">`:'<span style="font-size:48px">🌾</span>'}</div>
            <div style="font-size:18px;font-weight:700">${esc(st.shop_name||'YOUR_SHOP_NAME')}</div>
            <div style="font-size:11px;color:var(--s500)">${esc(st.address||'')}</div>
            <div style="font-size:11px;color:var(--s500)">License: ${esc(st.license||'')}</div>
          </div>
          <div class="card"><div style="font-size:16px;font-weight:600">Hello, ${esc(c.name)}</div>
            <div class="grid-3" style="margin-top:12px">
              <div class="mini-stat"><div class="lbl">Total Bought</div><div class="val">${rs(c.total_bought)}</div></div>
              <div class="mini-stat"><div class="lbl">Total Paid</div><div class="val" style="color:var(--b700)">${rs(c.total_paid)}</div></div>
              <div class="mini-stat"><div class="lbl">Due</div><div class="val" style="color:var(--r600)">${rs(c.due)}</div></div>
            </div></div>
          ${Number(c.due)>0 && upi ? `<div class="card" style="text-align:center"><div style="font-weight:600;margin-bottom:8px">Pay via UPI</div><div style="font-size:13px;color:var(--s500);margin-bottom:6px">${esc(upi)}</div><div id="portal-qr" style="display:inline-block;padding:6px;background:#fff;border:1px solid var(--s200);border-radius:8px"></div><div style="font-size:11px;color:var(--s400);margin-top:6px">Scan with any UPI app</div></div>` : ''}
          <div class="card"><h2 style="font-weight:600;margin-bottom:10px">Your transactions</h2>
            ${txs.length===0?'<p style="color:var(--s400);font-size:13px">No transactions yet</p>':txs.map(t=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--s100);font-size:13px"><div><div style="font-weight:500">${t.type} - ${esc(t.ref)}</div><div style="font-size:11px;color:var(--s500)">${fmtDate(t.date)}</div></div><div style="font-weight:500;color:${t.sign<0?'var(--s800)':'var(--b700)'}">${t.sign<0?'-':'+'}${rs(t.amount)}</div></div>`).join('')}
          </div>
          <p style="text-align:center;font-size:11px;color:var(--s400)">Thank you</p>
        </div>
      </div>`;
    if(Number(c.due)>0 && upi){
      const link = 'upi://pay?' + new URLSearchParams({ pa: upi, pn: owner, am: Number(c.due).toFixed(2), cu: 'INR', tn: 'Payment from ' + c.name }).toString();
      try{ const url = await QRCode.toDataURL(link, {margin:1,width:160}); $('#portal-qr').innerHTML = '<img src="'+url+'" style="width:140px;height:140px;display:block">'; }catch(e){}
    }
  }catch(err){
    $('#app').innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--s500)">Error: ' + esc(err.message) + '</div>';
  }
}

/* ============ ROUTER ============ */
async function route(){
  const hash = location.hash || '#/';
  if(hash.startsWith('#/c/')){ await renderPortal(hash.slice(4)); return; }
  if(!SESSION){ renderLogin(); return; }
  if(!DB.settings && !DB.customers.length && !DB.products.length){ await syncDB(); }
  renderLayout();
  const content = $('#content');
  try{
    if(hash === '#/' || hash === '') renderDashboard(content);
    else if(hash === '#/myshop') renderMyShop(content);
    else if(hash === '#/customers') renderCustomers(content);
    else if(hash.startsWith('#/customer/')) await renderCustomerProfile(content, hash.slice(11));
    else if(hash === '#/products') renderProducts(content);
    else if(hash === '#/invoices') renderInvoices(content);
    else if(hash === '#/invoice/new') renderNewInvoice(content);
    else if(hash.startsWith('#/invoice/')) await renderInvoiceView(content, hash.slice(10));
    else if(hash === '#/suppliers') renderSuppliers(content);
    else if(hash.startsWith('#/supplier/')) await renderSupplierProfile(content, hash.slice(11));
    else if(hash === '#/purchases') renderPurchases(content);
    else if(hash === '#/returns') renderReturns(content);
    else if(hash === '#/analytics') renderAnalytics(content);
    else if(hash === '#/pnl') renderPnL(content);
    else if(hash === '#/reports') renderReports(content);
    else if(hash === '#/import') renderImport(content);
    else renderDashboard(content);
  }catch(err){
    console.error(err);
    content.innerHTML = '<div class="card" style="color:var(--r600)">Error: ' + esc(err.message||String(err)) + '</div>';
  }
}

window.addEventListener('hashchange', route);

/* ============ BOOT ============ */
(async () => {
  applyFavicon();
  $('#app').innerHTML = '<div class="loading"><div class="spinner"></div><div>Connecting to Supabase...</div></div>';
  try{
    await initAuth();
    if(SESSION){
      await syncDB();
    }
     if (typeof loadSubscription === 'function') { await loadSubscription(); }
  }catch(e){ console.error('boot', e); }
  await route();
})();
