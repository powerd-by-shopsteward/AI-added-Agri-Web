      kb_sb = supabase.createClient(KB_SUPABASE_URL, KB_SUPABASE_ANON_KEY);
    }
  } catch(e) { console.error('Bot Supabase init failed:', e); }

  var botWrapper = document.getElementById('kb-bot-wrapper');
  var bot = document.getElementById('kb-bot');
  var panel = document.getElementById('kb-panel');
  var messages = document.getElementById('kb-messages');
  var typing = document.getElementById('kb-typing');
  var input = document.getElementById('kb-input');

  // ============================================================
  // POSITION + DRAG
  // ============================================================
  var isDragging = false, dragStartX = 0, dragStartY = 0, startLeft = 0, startTop = 0, hasMoved = false;
  var DRAG_THRESHOLD = 8;

  (function initPos() {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem('kb_bot_pos')); } catch(e) {}
    if (saved && typeof saved.left === 'number' && typeof saved.top === 'number') {
      var maxL = window.innerWidth - 70, maxT = window.innerHeight - 70;
      botWrapper.style.left = Math.max(0, Math.min(maxL, saved.left)) + 'px';
      botWrapper.style.top = Math.max(0, Math.min(maxT, saved.top)) + 'px';
    } else {
      var r = botWrapper.getBoundingClientRect();
      botWrapper.style.left = r.left + 'px';
      botWrapper.style.top = r.top + 'px';
    }
    botWrapper.style.right = 'auto';
    botWrapper.style.bottom = 'auto';
  })();

  function getPoint(e) {
    if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    if (e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }

  function onDragStart(e) {
    if (isDragging || panel.contains(e.target)) return;
    var p = getPoint(e);
    dragStartX = p.x; dragStartY = p.y;
    var r = botWrapper.getBoundingClientRect();
    startLeft = r.left; startTop = r.top;
    isDragging = true; hasMoved = false;
    document.addEventListener('pointermove', onDragMove, { passive: false });
    document.addEventListener('pointerup', onDragEnd);
    document.addEventListener('pointercancel', onDragEnd);
    document.addEventListener('touchmove', onDragMove, { passive: false });
    document.addEventListener('touchend', onDragEnd);
    document.addEventListener('touchcancel', onDragEnd);
    document.addEventListener('mousemove', onDragMove);
    document.addEventListener('mouseup', onDragEnd);
  }

  function onDragMove(e) {
    if (!isDragging) return;
    var p = getPoint(e);
    var dx = p.x - dragStartX, dy = p.y - dragStartY;
    if (!hasMoved && (Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD)) {
      hasMoved = true;
      botWrapper.classList.add('kb-dragging');
    }
    if (!hasMoved) return;
    if (e.cancelable) e.preventDefault();
    var maxL = window.innerWidth - 70, maxT = window.innerHeight - 70;
    var L = Math.max(0, Math.min(maxL, startLeft + dx));
    var T = Math.max(0, Math.min(maxT, startTop + dy));
    botWrapper.style.left = L + 'px';
    botWrapper.style.top = T + 'px';
    if (panel.classList.contains('kb-open')) positionPanel();
  }

  function onDragEnd() {
    if (!isDragging) return;
    isDragging = false;
    botWrapper.classList.remove('kb-dragging');
    ['pointermove','pointerup','pointercancel','touchmove','touchend','touchcancel','mousemove','mouseup'].forEach(function(evt) {
      document.removeEventListener(evt, onDragMove);
      document.removeEventListener(evt, onDragEnd);
    });
    if (hasMoved) {
      var r = botWrapper.getBoundingClientRect();
      try { localStorage.setItem('kb_bot_pos', JSON.stringify({ left: r.left, top: r.top })); } catch(e) {}
    } else {
      kbToggle();
    }
    hasMoved = false;
  }

  botWrapper.addEventListener('pointerdown', onDragStart);
  botWrapper.addEventListener('touchstart', onDragStart, { passive: true });
  botWrapper.addEventListener('mousedown', onDragStart);

  // ============================================================
  // PANEL POSITION
  // ============================================================
  function positionPanel() {
    var r = botWrapper.getBoundingClientRect();
    var pw = 320, ph = Math.min(400, window.innerHeight * 0.6), m = 20;
    var L = r.left + 70 - pw;
    var T = r.top - ph - m;
    if (T < m) T = r.bottom + m;
    if (L < m) L = m;
    if (L + pw > window.innerWidth - m) L = window.innerWidth - pw - m;
    if (T + ph > window.innerHeight - m) T = window.innerHeight - ph - m;
    panel.style.left = L + 'px';
    panel.style.top = T + 'px';
    panel.style.right = 'auto';
    panel.style.bottom = 'auto';
    panel.style.transformOrigin = ((r.left + 35) - L) + 'px ' + ((r.top + 35) - T) + 'px';
  }

  window.addEventListener('resize', function() {
    if (panel.classList.contains('kb-open')) positionPanel();
  });

  // ============================================================
  // EMOTIONS
  // ============================================================
  var emotionTimer = null;
  function setEmotion(name, duration) {
    if (duration === undefined) duration = 0;
    bot.className = '';
    if (name) bot.classList.add('kb-' + name);
    if (emotionTimer) clearTimeout(emotionTimer);
    if (duration > 0) {
      emotionTimer = setTimeout(function() {
        bot.classList.remove('kb-' + name);
        idleLoop();
      }, duration);
    }
  }

  var idleTimer;
  function idleLoop() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function() {
      if (Math.random() < 0.5) blink();
      idleLoop();
    }, 2000 + Math.random() * 4000);
  }

  function blink() {
    if (bot.classList.contains('kb-thinking') || bot.classList.contains('kb-searching') || bot.classList.contains('kb-happy')) return;
    setEmotion('blink', 150);
  }

  setInterval(function() {
    if (!bot.classList.contains('kb-thinking') && !bot.classList.contains('kb-searching') && !bot.classList.contains('kb-blink')) blink();
  }, 3500);

  idleLoop();

  function detectEmotion(text) {
    var t = text.toLowerCase();
    if (/\b(due|dues|unpaid|pending|overdue|owe|owed|debt|late|remaining|left|baki|bakaya|udhaar)\b/.test(t)) return { during: 'searching', after: 'sad' };
    if (/\b(hi|hello|hey|namaste|greetings|morning|evening)\b/.test(t)) return { during: 'listening', after: 'happy' };
    if (/\b(help|what can you|how do you|guide|assist|who are you)\b/.test(t)) return { during: 'listening', after: 'listening' };
    if (/\b(problem|error|issue|broken|wrong|fail|not working|stuck)\b/.test(t)) return { during: 'thinking', after: 'confused' };
    if (/\b(count|how many|average|calculate|sum|compare|report|analyze|total)\b/.test(t)) return { during: 'thinking', after: 'happy' };
    if (/\b(find|search|show|list|where|which|who|look up|display|tell me|dekhao|koto|kitna)\b/.test(t)) return { during: 'searching', after: 'happy' };
    if (/\b(sale|sales|sold|sell|profit|revenue|earned|income|money|cash|today|aaj|becha)\b/.test(t)) return { during: 'thinking', after: 'happy' };
    return { during: 'thinking', after: 'happy' };
  }

  // ============================================================
  // CHAT TOGGLE
  // ============================================================
  function triggerBounce() {
    botWrapper.classList.remove('kb-bounce');
    void botWrapper.offsetWidth;
    botWrapper.classList.add('kb-bounce');
    setTimeout(function() { botWrapper.classList.remove('kb-bounce'); }, 750);
  }

  function kbToggle() {
    var isOpening = !panel.classList.contains('kb-open');
    if (isOpening) positionPanel();
    panel.classList.toggle('kb-open');
    triggerBounce();
    if (isOpening) setEmotion('listening', 800);
  }
  window.kbToggle = kbToggle;

  // ============================================================
  // THINKING
  // ============================================================
  var thinkInterval = null;
  function startThinking(mode) {
    clearInterval(thinkInterval);
    if (mode === 'searching') {
      setEmotion('searching');
      thinkInterval = setInterval(function() { bot.classList.toggle('kb-searching'); }, 500);
    } else if (mode === 'listening') {
      setEmotion('listening');
    } else {
      setEmotion('thinking');
      thinkInterval = setInterval(function() { bot.classList.toggle('kb-searching'); }, 700);
    }
  }
  function stopThinking() {
    clearInterval(thinkInterval);
    bot.classList.remove('kb-thinking', 'kb-searching', 'kb-listening');
  }

  // ============================================================
  // ADD MESSAGE
  // ============================================================
  function addMsg(text, type) {
    var d = document.createElement('div');
    d.className = 'kb-msg kb-' + type;
    d.textContent = text;
    messages.appendChild(d);
    messages.scrollTop = messages.scrollHeight;
  }

  // ============================================================
  // SEND
  // ============================================================
  var isSending = false;
  window.kbSend = function(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    if (isSending) return;
    isSending = true;
    setTimeout(function() { isSending = false; }, 500);

    var text = input.value.trim();
    if (!text) return;

    addMsg(text, 'user');
    input.value = '';

    var emotion = detectEmotion(text);
    typing.style.display = 'flex';
    startThinking(emotion.during);

    if (!kb_sb) {
      typing.style.display = 'none';
      stopThinking();
      setEmotion('sad', 2000);
      addMsg('Error: Supabase not connected.', 'bot');
      return;
    }

    (async function() {
      try {
        var startRes = await kb_sb.rpc('ai_chat_start', { user_question: text });
        if (startRes.error || !startRes.data) throw new Error(startRes.error ? startRes.error.message : 'AI did not respond');

        var reqId = startRes.data;
        var startedAt = Date.now();
        var answer = null;

        while (Date.now() - startedAt < 30000) {
          await new Promise(function(r) { setTimeout(r, 800); });
          var checkRes = await kb_sb.rpc('ai_chat_check', { req_id: reqId });
          if (checkRes.error) continue;
          if (checkRes.data && checkRes.data !== 'WAITING') { answer = checkRes.data; break; }
        }

        typing.style.display = 'none';
        stopThinking();

        if (!answer) {
          setEmotion('sad', 2000);
          addMsg('The AI is taking too long. Please try again.', 'bot');
        } else if (answer.indexOf('AI error:') === 0) {
          setEmotion('sad', 2000);
          addMsg(answer, 'error');
        } else {
          setEmotion(emotion.after, 1800);
          addMsg(answer, 'bot');
        }
        setEmotion('speaking', 900);
        setTimeout(idleLoop, 1000);
      } catch (err) {
        typing.style.display = 'none';
        stopThinking();
        setEmotion('sad', 2000);
        addMsg('Error: ' + (err.message || err), 'error');
      }
    })();
  };

  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); window.kbSend(e); }
  });
})();
</script>

<script>
(function(){
  var IGNORE = [
    'Script error',
    'Script error.',
    '__firefox__',
    'window.ethereum',
    'MetaMask',
    'chrome-extension',
    'moz-extension',
    'safari-extension',
    'Reader Mode',
    '@ line'          // catch-all for lines that only have "@ line" left
  ];
  function isNoise(s){
    s = String(s||'').trim();
    if (!s) return true;
    if (/^[X!]\s*Script error\.?\s*(@\s*line\s*\??)?$/i.test(s)) return true;
    for (var i=0;i<IGNORE.length;i++) if (s.indexOf(IGNORE[i]) !== -1) return true;
    return false;
  }

  // Block from reaching the box
  window.addEventListener('error', function(e){
    if (isNoise(e.message)) { e.preventDefault(); e.stopImmediatePropagation(); return false; }
  }, true);

  window.addEventListener('unhandledrejection', function(e){
    var m = e.reason && (e.reason.message || e.reason);
    if (isNoise(m)) { e.preventDefault(); e.stopImmediatePropagation(); }
  }, true);

  // Scrub anything that slipped through
  setInterval(function(){
    var el = document.getElementById('error-box');
    if (!el) return;
    var kept = (el.textContent||'').split('\n').filter(function(l){ return !isNoise(l); }).join('\n');
    if (kept.trim() === '') { el.style.display = 'none'; el.textContent = ''; }
    else el.textContent = kept;
  }, 250);
})();
</script>
<script>
// ==========================================
// SCRIPT M: CUSTOMER STATEMENT (Final - no main code changes)
// ==========================================
(function() {
  let btPrinter = null; // own connection, doesn't touch main code

  function padLine(left, right, width = 32) {
    left = String(left); right = String(right);
    if (left.length + right.length > width) left = left.substring(0, width - right.length - 1);
    const spaces = ' '.repeat(Math.max(1, width - left.length - right.length));
    return left + spaces + right;
  }

  function buildTxs(cust) {
    const invs = DB.invoices
      .filter(i => i.customer_id === cust.id)
      .sort((a, b) => txDate(a, 'invoice_date').localeCompare(txDate(b, 'invoice_date')));
    const pays = DB.payments
      .filter(p => p.customer_id === cust.id)
      .sort((a, b) => txDate(a, 'payment_date').localeCompare(txDate(b, 'payment_date')));

    const txs = [];
    invs.forEach(i => txs.push({ date: txDate(i, 'invoice_date'), ref: i.invoice_no, amount: Number(i.due) || 0 }));
    pays.forEach(p => txs.push({ date: txDate(p, 'payment_date'), ref: (p.mode || 'cash'), amount: -(Number(p.amount) || 0) }));
    txs.sort((a, b) => a.date.localeCompare(b.date));
    return txs;
  }

  async function printStatementViaBluetooth(cust, txs) {
    if (!navigator.bluetooth) { toast('Bluetooth not supported. Use Chrome on Android.', 'error'); return; }
    if (typeof ReceiptPrinterEncoder === 'undefined' || typeof WebBluetoothReceiptPrinter === 'undefined') {
      toast('Printer libraries not loaded.', 'error'); return;
    }
    try {
      if (!btPrinter) {
        btPrinter = new WebBluetoothReceiptPrinter();
        btPrinter.addEventListener('connected', d => console.log('Connected:', d.name));
        await btPrinter.connect();
      }
      const encoder = new ReceiptPrinterEncoder({ language: 'esc-pos' });

      encoder.align('center').bold(true).text(SETTINGS.shop_name || 'Krishi Bandhu').newline();
      encoder.bold(false).text(SETTINGS.owner_name || '').newline();
      encoder.text(SETTINGS.address || '').newline();
      if (SETTINGS.phone) encoder.text('Ph: ' + SETTINGS.phone).newline();
      encoder.text('--------------------------------').newline();

      encoder.bold(true).align('center').text('CUSTOMER STATEMENT').newline();
      encoder.bold(false).align('left');
      encoder.text('Name: ' + (cust.name || '')).newline();
      if (cust.phone) encoder.text('Phone: ' + cust.phone).newline();
      encoder.text('--------------------------------').newline();

      encoder.text(padLine('Date  Ref', 'Amount')).newline();
      encoder.text('--------------------------------').newline();

      if (txs.length === 0) {
        encoder.text('No transactions').newline();
      } else {
        txs.forEach(t => {
          const dateShort = (t.date || '').slice(5);
          const amtStr = Number(t.amount).toFixed(2);
          const left = dateShort + ' ' + t.ref;
          if (left.length > 20) {
            encoder.text(left.substring(0, 20)).newline();
            encoder.text(padLine('', amtStr)).newline();
          } else {
            encoder.text(padLine(left, amtStr)).newline();
          }
        });
      }

      encoder.text('--------------------------------').newline();
      // Uses global inr() for comma formatting, matches your invoice style exactly
      encoder.bold(true).text(padLine('CURRENT DUE:', 'Rs.' + inr(cust.due))).newline();
      encoder.bold(false);
      encoder.align('center').newline(1).text('Thank you! Visit again.').newline();
      encoder.newline(2);
      encoder.cut();

      await btPrinter.print(encoder.encode());
      toast('Statement printed!', 'success');
    } catch (error) {
      console.error('Print error:', error);
      toast('Printing failed: ' + error.message, 'error');
      btPrinter = null;
    }
  }

  function buildStatementPDF(cust, txs) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    let y = 15;

    doc.setFontSize(16); doc.setFont('helvetica', 'bold'); doc.setTextColor(22, 163, 74);
    doc.text(SETTINGS.shop_name || 'Krishi Bandhu', 105, y, { align: 'center' });
    y += 7;
    doc.setFontSize(10); doc.setFont('helvetica', 'normal'); doc.setTextColor(71, 85, 105);
    doc.text(SETTINGS.owner_name || '', 105, y, { align: 'center' }); y += 5;
    doc.text(SETTINGS.address || '', 105, y, { align: 'center' }); y += 5;
    if (SETTINGS.phone) { doc.text('Ph: ' + SETTINGS.phone, 105, y, { align: 'center' }); y += 5; }
    doc.text('License: ' + (SETTINGS.license || ''), 105, y, { align: 'center' }); y += 8;

    doc.setDrawColor(22, 163, 74); doc.setLineWidth(0.5);
    doc.line(14, y, 196, y); y += 8;

    doc.setFontSize(13); doc.setFont('helvetica', 'bold'); doc.setTextColor(22, 163, 74);
    doc.text('CUSTOMER STATEMENT', 105, y, { align: 'center' }); y += 8;

    doc.setTextColor(30, 41, 59); doc.setFontSize(10); doc.setFont('helvetica', 'normal');
    doc.text('Name: ' + (cust.name || ''), 14, y); y += 5;
    if (cust.phone) { doc.text('Phone: ' + cust.phone, 14, y); y += 5; }
    if (cust.address) { doc.text('Address: ' + cust.address, 14, y, { maxWidth: 180 }); y += 5; }
    y += 3;

    const body = txs.length
      ? txs.map(t => [fmtDate(t.date), String(t.ref), Number(t.amount).toFixed(2)])
      : [['-', 'No transactions', '0.00']];

    doc.autoTable({
      startY: y,
      head: [['Date', 'Reference', 'Amount (Rs.)']],
      body,
      theme: 'grid',
      headStyles: { fillColor: [22, 163, 74], textColor: 255, fontSize: 10 },
      bodyStyles: { fontSize: 9 },
      columnStyles: { 2: { halign: 'right' } },
      margin: { left: 14, right: 14 }
    });
    y = doc.lastAutoTable.finalY + 8;

    if (y > 250) { doc.addPage(); y = 20; }

    doc.setFontSize(10); doc.setFont('helvetica', 'normal'); doc.setTextColor(30, 41, 59);
    doc.text('Total Billed:', 130, y); doc.text('Rs.' + inr(cust.total_bought || 0), 196, y, { align: 'right' }); y += 5;
    doc.text('Total Paid:',   130, y); doc.text('Rs.' + inr(cust.total_paid   || 0), 196, y, { align: 'right' }); y += 6;

    doc.setFontSize(13); doc.setFont('helvetica', 'bold'); doc.setTextColor(220, 38, 38);
    doc.text('CURRENT DUE:', 130, y); doc.text('Rs.' + inr(cust.due || 0), 196, y, { align: 'right' }); y += 10;

    if (Number(cust.due) > 0 && SETTINGS.upi) {
      doc.setTextColor(30, 41, 59); doc.setFontSize(9); doc.setFont('helvetica', 'normal');
      doc.text('UPI: ' + SETTINGS.upi, 14, y); y += 5;
    }

    doc.setFontSize(9); doc.setTextColor(148, 163, 184);
    doc.text('Thank you! Visit again.', 105, 290, { align: 'center' });

    return doc;
  }

  async function shareStatementAsPDF(cust, txs) {
    try {
      toast('Generating PDF...', 'info');
      const doc = buildStatementPDF(cust, txs);
      const blob = doc.output('blob');
      const fileName = 'Statement-' + String(cust.name || 'Customer').replace(/\s+/g, '_') + '.pdf';
      const file = new File([blob], fileName, { type: 'application/pdf' });

      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: 'Statement - ' + (cust.name || ''),
            text: 'Your account statement from ' + (SETTINGS.shop_name || 'Krishi Bandhu')
          });
          toast('Shared successfully', 'success');
        } catch (err) {
          if (err && err.name === 'AbortError') return;
          console.error('Share error:', err);
          throw err;
        }
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = fileName; a.click();
        URL.revokeObjectURL(url);
        toast('PDF downloaded - share it on WhatsApp manually.', 'info');
      }
    } catch (err) {
      console.error('PDF share error:', err);
      toast('Could not generate PDF: ' + err.message, 'error');
    }
  }

  function addStatementButtons() {
    if (!location.hash.startsWith('#/customer/')) return;
    const pdfBtn = document.getElementById('cp-pdf');
    if (!pdfBtn) return;

    const custId = location.hash.slice(11);
    const cust = DB.customers.find(c => c.id === custId);
    if (!cust) return;

    if (!document.getElementById('btn-print-statement')) {
      const printBtn = document.createElement('button');
      printBtn.id = 'btn-print-statement';
      printBtn.className = 'btn btn-ghost';
      printBtn.textContent = '🖨 Print Statement (58mm)';
      pdfBtn.parentElement.insertBefore(printBtn, pdfBtn.nextSibling);

      printBtn.onclick = () => {
        const c = DB.customers.find(x => x.id === custId);
        if (!c) { toast('Customer not found', 'error'); return; }
        const txs = buildTxs(c);
        if (navigator.bluetooth) printStatementViaBluetooth(c, txs);
        else toast('Bluetooth not available on this device', 'error');
      };
    }

    if (!document.getElementById('btn-share-statement')) {
      const waBtn = document.createElement('button');
      waBtn.id = 'btn-share-statement';
      waBtn.className = 'btn';
      waBtn.style.background = '#25D366';
      waBtn.style.color = '#fff';
      waBtn.textContent = 'Share Statement (PDF)';
      pdfBtn.parentElement.appendChild(waBtn);

      waBtn.onclick = () => {
        const c = DB.customers.find(x => x.id === custId);
        if (!c) return;
        const txs = buildTxs(c);
        shareStatementAsPDF(c, txs);
      };
    }
  }

  setInterval(addStatementButtons, 500);
  addStatementButtons();
})();
</script>

  <script>
// ==========================================
// SIDEBAR MAGNETIC PULL & EXCLUDE CUSTOMER CARD
// ==========================================
(function() {
  // 1. Sidebar Magnetic Pull
  let ticking = false;
  document.addEventListener('mousemove', (e) => {
    const sidebar = document.querySelector('.sidebar');
    if (!sidebar || window.innerWidth <= 768) return;
    if (!ticking) {
      window.requestAnimationFrame(() => {
        const links = sidebar.querySelectorAll('.nav a');
        const mouseX = e.clientX; const mouseY = e.clientY;
        const pullStrength = 0.15; const threshold = 120;     
        links.forEach(link => {
          const linkRect = link.getBoundingClientRect();
          const linkX = linkRect.left + linkRect.width / 2;
          const linkY = linkRect.top + linkRect.height / 2;
          const dist = Math.hypot(mouseX - linkX, mouseY - linkY);
          if (dist < threshold) {
            const pullX = (mouseX - linkX) * pullStrength;
            const pullY = (mouseY - linkY) * pullStrength;
            link.style.transform = `translate(${pullX}px, ${pullY}px)`;
            link.style.transition = 'transform 0.1s ease-out';
          } else {
            link.style.transform = '';
            link.style.transition = 'transform 0.3s ease-out';
          }
        });
        ticking = false;
      });
      ticking = true;
    }
  });

  // 2. Tag Customer Profile Card to exclude from hover
  setInterval(() => {
    if (location.hash.startsWith('#/customer/')) {
      const content = document.getElementById('content');
      if (content) {
        const firstCard = content.querySelector('.card');
        if (firstCard && !firstCard.classList.contains('no-hover-card')) {
          firstCard.classList.add('no-hover-card');
        }
      }
    }
  }, 500);
})();
</script>

// ==========================================
// SUPPRESS "Cannot set properties of null" NOISE
// Safe: app is verified working. This hides false positives
// from hidden/mobile-only onclick assignments.
// ==========================================
(function() {
  var PATTERNS = [
    "Cannot set properties of null",
    "Cannot read properties of null"
  ];
  function isSuppressed(s) {
    s = String(s || '');
    for (var i = 0; i < PATTERNS.length; i++) if (s.indexOf(PATTERNS[i]) !== -1) return true;
    return false;
  }
  window.addEventListener('error', function(e) {
    if (isSuppressed(e.message)) { e.preventDefault(); e.stopImmediatePropagation(); }
  }, true);
  window.addEventListener('unhandledrejection', function(e) {
    var m = (e.reason && e.reason.message) || e.reason;
    if (isSuppressed(m)) { e.preventDefault(); e.stopImmediatePropagation(); }
  }, true);
  setInterval(function() {
    var el = document.getElementById('error-box');
    if (!el) return;
    var kept = (el.textContent || '').split('\n').filter(function(l) { return !isSuppressed(l); }).join('\n');
    if (kept.trim() === '') { el.style.display = 'none'; el.textContent = ''; }
    else el.textContent = kept;
  }, 250);
})();
</script>

<script>
/* ============================================================
   SUBSCRIPTION CORE
   Global state, helpers, auto-create, save guard.
   ============================================================ */
(function() {
  'use strict';

  const PLAN_AMOUNT = 599;
  const SUPPORT_WHATSAPP = '8637560557';
  const SUPPORT_EMAIL = 'shopsteward.in@gmail.com';
  const REMINDER_DAYS = 15;

  window.SUB = {
    loaded: false,
    active: false,
    expires_at: null,
    last_paid_at: null,
    amount: PLAN_AMOUNT
  };

  // ---------- HELPERS ----------
  window.subDaysLeft = function() {
    if (!SUB.expires_at) return 0;
    const diff = new Date(SUB.expires_at).getTime() - Date.now();
    return Math.max(0, Math.ceil(diff / (1000 * 60 * 60 * 24)));
  };

  window.subPercentLeft = function() {
    if (!SUB.expires_at) return 0;
    const total = 365 * 24 * 60 * 60 * 1000;
    const left = Math.max(0, new Date(SUB.expires_at).getTime() - Date.now());
    return Math.max(0, Math.min(100, Math.round((left / total) * 100)));
  };

  window.subDaysOverdue = function() {
    if (!SUB.expires_at) return 0;
    const diff = Date.now() - new Date(SUB.expires_at).getTime();
    return Math.max(0, Math.ceil(diff / (1000 * 60 * 60 * 24)));
  };

  window.isSubActive = function() {
    if (!SUB.expires_at) return false;
    return SUB.active === true && new Date(SUB.expires_at).getTime() > Date.now();
  };

  window.isSubExpiringSoon = function() {
    return isSubActive() && subDaysLeft() <= REMINDER_DAYS;
  };

  window.isSubExpired = function() {
    return !isSubActive();
  };

  window.subStatusColor = function() {
    if (isSubExpired()) return '#ef4444';
    if (subDaysLeft() <= REMINDER_DAYS) return '#fbbf24';
    return '#22c55e';
  };

  window.subStatusLabel = function() {
    if (isSubExpired()) return 'Expired';
    if (subDaysLeft() <= REMINDER_DAYS) return 'Expiring Soon';
    return 'Active';
  };

  // ---------- LOAD + AUTO-CREATE ----------
  window.loadSubscription = async function() {
    try {
      const { data, error } = await sb.from('subscriptions').select('*').eq('id', 1).maybeSingle();
      if (error) throw error;

      if (!data) {
        // First-ever login → create a fresh 1-year subscription
        const now = new Date();
        const nextYear = new Date(now);
        nextYear.setFullYear(nextYear.getFullYear() + 1);
        const { data: created, error: createErr } = await sb.from('subscriptions').insert({
          id: 1,
          active: true,
          started_at: now.toISOString(),
          expires_at: nextYear.toISOString(),
          amount: PLAN_AMOUNT,
          notes: 'Auto-created on first login'
        }).select().single();
        if (createErr) throw createErr;
        Object.assign(SUB, {
          loaded: true, active: true,
          expires_at: created.expires_at,
          last_paid_at: created.last_paid_at,
          amount: created.amount || PLAN_AMOUNT
        });
      } else {
        Object.assign(SUB, {
          loaded: true,
          active: !!data.active,
          expires_at: data.expires_at,
          last_paid_at: data.last_paid_at,
          amount: data.amount || PLAN_AMOUNT
        });
      }
    } catch (e) {
      console.warn('Subscription load failed:', e.message);
      SUB.loaded = true;
      // Fail-open: don't lock user out if we can't reach the table
      SUB.active = true;
      SUB.expires_at = new Date(Date.now() + 365 * 24 * 60 * 60 * 1000).toISOString();
    }
  };

  // ---------- GUARD ----------
  // Call at the start of every save. Returns true if allowed, false if blocked (and shows popup).
  window.blockIfExpired = function() {
    if (isSubActive()) return true;
    if (typeof openSubscriptionExpiredModal === 'function') {
      openSubscriptionExpiredModal();
    } else {
      alert('Your yearly subscription has expired. Please renew for ₹' + PLAN_AMOUNT + ' to keep saving data.\n\nUPI: ' + (SETTINGS.upi || '-') + '\nWhatsApp: ' + SUPPORT_WHATSAPP);
    }
    return false;
  };

  // ---------- REACTIVATE CHECK ----------
  // Every 60s, refresh the countdown / expiry state. Cheap and safe.
  setInterval(() => {
    if (SUB.loaded) {
      try { updateSubscriptionUI(); } catch(e) {}
    }
  }, 60000);

  window.updateSubscriptionUI = function() {
    if (typeof renderSubSidebarPill === 'function') renderSubSidebarPill();
    if (typeof renderSubTopBanner === 'function') renderSubTopBanner();
  };

  // Expose constants for other blocks
  window.SUB_PLAN_AMOUNT = PLAN_AMOUNT;
  window.SUB_SUPPORT_WHATSAPP = SUPPORT_WHATSAPP;
  window.SUB_SUPPORT_EMAIL = SUPPORT_EMAIL;
})();
</script>

<script>
/* ============================================================
   SUBSCRIPTION CARD + QR MODAL + EXPIRED POPUP
   Bulletproof QR: 4 fallback methods.
   ============================================================ */
(function() {
  'use strict';

  // ================= OWNER (YOU) HARDCODED =================
  const SUB_OWNER_UPI = 'shopsteward.in@ybl';
  const SUB_OWNER_NAME = 'Samiran Das';
  // ==========================================================

  // ---------- Build UPI string ----------
  function buildUpiString(amount, note) {
    const amt = Number(amount).toFixed(2);
    const tn = encodeURIComponent((note || 'Subscription').substring(0, 50));
    const pn = encodeURIComponent(SUB_OWNER_NAME);
    const pa = SUB_OWNER_UPI;
    return `upi://pay?pa=${pa}&pn=${pn}&am=${amt}&cu=INR&tn=${tn}`;
  }

  // ---------- QR service URLs (each is a plain <img src="...">) ----------
  function getQrUrls(str) {
    const enc = encodeURIComponent(str);
    return [
      // 1. qrserver.com — most reliable, free, no signup
      `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${enc}&margin=10`,
      // 2. quickchart.io — reliable fallback
      `https://quickchart.io/qr?text=${enc}&size=400&margin=2`,
      // 3. Google Chart API — deprecated but often still works
      `https://chart.googleapis.com/chart?chs=400x400&cht=qr&chl=${enc}&choe=UTF-8`,
      // 4. QR code via another mirror
      `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${enc}&color=000000&bgcolor=FFFFFF`
    ];
  }

  // ---------- Preload test — returns first URL that loads ----------
  function findWorkingQrUrl(urls, timeoutMs) {
    return new Promise((resolve) => {
      let settled = false;
      let idx = 0;

      const tryNext = () => {
        if (settled) return;
        if (idx >= urls.length) {
          settled = true;
          resolve('');
          return;
        }
        const url = urls[idx];
        idx++;
        const img = new Image();
        const timer = setTimeout(() => {
          img.onload = null;
          img.onerror = null;
          tryNext();
        }, timeoutMs || 3500);
        img.onload = () => {
          if (settled) return;
          clearTimeout(timer);
          settled = true;
          console.log('[SUB-QR] Working URL:', url);
          resolve(url);
        };
        img.onerror = () => {
          clearTimeout(timer);
          console.warn('[SUB-QR] Failed:', url);
          tryNext();
        };
        img.src = url;
      };
      tryNext();
    });
  }

  // ---------- Build the QR result ----------
  async function buildOwnerUpiQr(amount, note) {
    const str = buildUpiString(amount, note);
    console.log('[SUB-QR] UPI string:', str);

    const urls = getQrUrls(str);
    const working = await findWorkingQrUrl(urls, 3500);

    if (working) {
      return { qr: working, upi: SUB_OWNER_UPI, name: SUB_OWNER_NAME, error: '' };
    }

    // Last resort — try the local qrcode library if it happens to be loaded
    if (typeof QRCode !== 'undefined' || typeof qrcode !== 'undefined') {
      const lib = (typeof QRCode !== 'undefined') ? QRCode : qrcode;
      try {
        const dataUrl = await lib.toDataURL(str, { margin: 2, width: 300, errorCorrectionLevel: 'L' });
        if (dataUrl && dataUrl.startsWith('data:image')) {
          console.log('[SUB-QR] Used local qrcode library');
          return { qr: dataUrl, upi: SUB_OWNER_UPI, name: SUB_OWNER_NAME, error: '' };
        }
      } catch (e) {
        console.warn('[SUB-QR] local lib failed:', e.message);
      }
    }

    return {
      qr: '',
      upi: SUB_OWNER_UPI,
      name: SUB_OWNER_NAME,
      error: 'No QR service reachable. Check internet connection.'
    };
  }

        </div>

    `;

            <div style="background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.10); border-radius:12px; padding:12px 14px; display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px;">
              <code style="font-size:14px; color:#f4f4f5; font-weight:600; word-break:break-all; font-family:'Courier New',monospace;">${esc(SUB_OWNER_UPI)}</code>

            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <a id="sub-exp-wa" target="_blank" class="btn" style="background:#25D366; color:#fff; font-weight:600;">💬 WhatsApp us</a>
              <button class="btn btn-ghost" onclick="closeModal()">Close</button>
            </div>

        </div>

        <div style="margin-top:16px; padding-top:14px; border-top:1px solid rgba(255,255,255,0.06); text-align:center; font-size:12px; color:#94a3b8; line-height:1.9;">
          <div style="color:#f87171; font-weight:600; margin-bottom:4px;">⚠ Overdue by ${overdue} day${overdue===1?'':'s'}</div>
          <div>✉ <a href="mailto:${esc(SUB_SUPPORT_EMAIL)}" style="color:#86efac;">${esc(SUB_SUPPORT_EMAIL)}</a></div>
          <div style="font-size:11px; color:#64748b; margin-top:4px;">Your existing data is safe. It just won't update until you renew.</div>
        </div>
      </div>
    `, root => {
      const copyBtn = root.querySelector('#sub-exp-copy');
      if (copyBtn) copyBtn.onclick = async () => {
        try { await navigator.clipboard.writeText(SUB_OWNER_UPI); toast('UPI ID copied', 'success'); }
        catch(e) { prompt('Copy UPI ID:', SUB_OWNER_UPI); }
      };
      const waBtn = root.querySelector('#sub-exp-wa');
      if (waBtn) {
        waBtn.href = waLink(SUB_SUPPORT_WHATSAPP,
          `Hi, I want to renew my yearly subscription (₹${amount}).\n\nShop: ${SETTINGS.shop_name || ''}\nUPI: ${SUB_OWNER_UPI}\n\nPlease let me know how to proceed.`);
      }
      const img = root.querySelector('#sub-exp-qr-img');
      if (img) {
        let idx = 1;
        img.onerror = () => {
          if (idx >= candidateUrls.length) {
            img.outerHTML = `<div style="width:190px; height:190px; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#b91c1c; font-size:11px; background:#fef2f2; border-radius:8px; padding:10px; text-align:center;"><div style="font-size:22px; margin-bottom:6px;">⚠</div><div style="font-weight:600;">QR unavailable</div></div>`;
            return;
          }
          img.src = candidateUrls[idx];
          idx++;
        };
      }
    });
  };

  // ---------- SAVE GUARD WRAPPERS ----------
  const guardedFns = [
    'openCustomerFormModal',
    'openProductForm',
    'openSupplierForm',
    'openBillForm',
    'openSupPaymentForm',
    'openExpenseForm',
    'renderNewInvoice'
  ];

  guardedFns.forEach(fnName => {
    const orig = window[fnName];
    if (typeof orig !== 'function') return;
    window[fnName] = function() {
      if (!blockIfExpired()) return;
      return orig.apply(this, arguments);
    };
  });

  document.addEventListener('click', function(e) {
    const t = e.target.closest('button, a');
    if (!t) return;
    if (t.id === 'sub-main-btn' || t.id === 'sub-manage-btn' ||
        t.id === 'sub-banner-renew' || t.id === 'sub-view-qr') return;

    const isSaveAction =
      t.id === 'btn-pay' ||
      t.id === 'btn-old-due' ||
      t.id === 'rt-submit' ||
      t.id === 'btn-export' ||
      (t.dataset && (t.dataset.del !== undefined
        || t.dataset.delInv !== undefined
        || t.dataset.payDel !== undefined
        || t.dataset.delPur !== undefined
        || t.dataset.delRet !== undefined
        || t.dataset.delExp !== undefined)) ||
      /^\+ (Payment|Purchase|Add Bill|Add Expense|Add Customer|Add Product|Add Supplier)/i.test(t.textContent || '');

    if (!isSaveAction) return;
    if (isSubActive()) return;

    e.preventDefault();
    e.stopPropagation();
    openSubscriptionExpiredModal();
  }, true);
})();
</script>

/* ============================================================
   BACKDROP IMAGE UPLOADER — My Shop section
   Injects a "Backdrop Image" card right under the Logo card.
   ============================================================ */
(function () {
  'use strict';

  const _origRenderMyShopBg = window.renderMyShop;
  if (typeof _origRenderMyShopBg !== 'function') return;

  window.renderMyShop = function (content) {
    _origRenderMyShopBg.apply(this, arguments);

    const uploadBtn = content.querySelector('#btn-upload');
    const logoCard  = uploadBtn ? uploadBtn.closest('.card') : null;
    if (!logoCard) return;
    if (content.querySelector('#bg-card')) return;

    const bgCard = document.createElement('div');
    bgCard.className = 'card';
    bgCard.id = 'bg-card';
    bgCard.innerHTML = `
      <h2 style="font-weight:600;margin-bottom:12px">Backdrop Image</h2>
      <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
        <div id="bg-preview"
             style="width:180px;height:100px;border:2px solid var(--s200);border-radius:12px;
                    background:${SETTINGS.background_image ? `url('${SETTINGS.background_image}') center/cover no-repeat` : 'var(--s50)'};
                    display:flex;align-items:center;justify-content:center;
                    font-size:11px;color:var(--s400);">
          ${SETTINGS.background_image ? '' : 'No backdrop'}
        </div>
        <div style="flex:1;min-width:200px">
          <input type="file" id="bg-input" accept="image/*" style="display:none">
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button id="bg-upload" class="btn btn-primary">Upload Backdrop</button>
            ${SETTINGS.background_image ? '<button id="bg-remove" class="btn btn-ghost" style="color:var(--r600)">Remove</button>' : ''}
          </div>
          <p style="font-size:12px;color:var(--s500);margin-top:8px">
            Full-screen page background. Auto-compressed to 1920 px wide.
          </p>
        </div>
      </div>`;

    logoCard.parentNode.insertBefore(bgCard, logoCard.nextSibling);

    const bgInput = bgCard.querySelector('#bg-input');
    bgCard.querySelector('#bg-upload').onclick = () => bgInput.click();

    bgInput.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) { toast('Please pick an image file', 'error'); return; }
      if (file.size > 8 * 1024 * 1024)     { toast('Image too big (max 8 MB)', 'error'); return; }

      const btn = bgCard.querySelector('#bg-upload');
      btn.disabled = true;
      btn.textContent = 'Compressing…';

      try {
        const dataUrl = await compressImage(file, 1920, 0.75);
        btn.textContent = 'Saving…';
        SETTINGS.background_image = dataUrl;

        const ok = await saveSettings();
        if (!ok) { toast('Could not save to Supabase', 'error'); return; }

        applyBackdrop();
        toast('Backdrop updated', 'success');
        route();
      } catch (err) {
        console.error('Backdrop upload failed:', err);
        toast('Upload failed: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Upload Backdrop';
      }
    };

    const rmBtn = bgCard.querySelector('#bg-remove');
    if (rmBtn) rmBtn.onclick = async () => {
      if (!confirm('Remove backdrop image?')) return;
      SETTINGS.background_image = '';
      const ok = await saveSettings();
      if (!ok) return;
      applyBackdrop();
      toast('Backdrop removed');
      route();
    };
  };
})();
</script>

<script>
/* ============================================================
   FIXED SIDEBAR TOGGLE SCRIPT
   ============================================================ */
(function() {
  'use strict';

  function setupSidebar() {
    const sidebar = document.querySelector('.sidebar');
    if (!sidebar) return;

    // 1. Restore saved state
    if (localStorage.getItem('sidebar_collapsed') === 'true') {
      document.body.classList.add('sidebar-collapsed');
    }

    // 2. Inject Toggle Button
    if (!document.getElementById('sidebar-toggle')) {
      const toggleBtn = document.createElement('div');
      toggleBtn.id = 'sidebar-toggle';
      
      const brand = sidebar.querySelector('.brand');
      if (brand) {
        brand.parentNode.insertBefore(toggleBtn, brand.nextSibling);
      } else {
        sidebar.insertBefore(toggleBtn, sidebar.firstChild);
      }

      // 3. Update Icon
      const updateIcon = () => {
        toggleBtn.innerHTML = document.body.classList.contains('sidebar-collapsed') ? '▶' : '☰'; 
      };
      updateIcon();

      // 4. Click Logic
      toggleBtn.addEventListener('click', function(e) {
        e.preventDefault();
        document.body.classList.toggle('sidebar-collapsed');
        localStorage.setItem('sidebar_collapsed', document.body.classList.contains('sidebar-collapsed'));
        updateIcon();
      });
    } else {
       // Keep icon synced if the app re-renders
       const toggleBtn = document.getElementById('sidebar-toggle');
       toggleBtn.innerHTML = document.body.classList.contains('sidebar-collapsed') ? '▶' : '☰';
    }
  }

  setupSidebar();

  // Observer to ensure the button stays there if the app refreshes the page
  new MutationObserver(() => {
    if (document.querySelector('.sidebar') && !document.getElementById('sidebar-toggle')) {
      setupSidebar();
    }
  }).observe(document.body, { childList: true, subtree: true });

})();
</script>
